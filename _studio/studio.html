<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🎬 YouTube Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='14' width='88' height='72' rx='14' fill='%23e58146'/%3E%3Cpath d='M8 36h84M30 15 22 36M55 15 47 36M80 15 72 36' stroke='%231a0f05' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3Cpath d='m44 50 22 12-22 12z' fill='%231a0f05'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  /* ============ DESIGN TOKENS ============ */
  :root{
    color-scheme:dark;
    /* Neutral graphite base — greys, not warm */
    --bg:#15161a; --panel:#1c1e24; --panel-2:#23252c; --panel-3:#2c2f38;
    --field:#1f2128; --line:#33363f; --line-2:#454954;
    --ink:#eceef3; --muted:#a4abb8; --faint:#6e7480;
    /* Signal-yellow accent (#ffe000) — the one bright on the greys */
    --accent:#ffe000; --accent-2:#ffe94d; --accent-ink:#1a1c20; --accent-soft:rgba(255,224,0,.15); --accent-line:rgba(255,224,0,.5);
    /* Supportive hues kept cool/orange so yellow stays the only signal colour */
    --info:#74a8cd; --info-soft:rgba(116,168,205,.15);
    --ok:#6fbf73; --ok-soft:rgba(111,191,115,.15);
    --warn:#e0913a; --warn-soft:rgba(224,145,58,.15);
    --danger:#df7058; --danger-soft:rgba(223,112,88,.15);
    --card:var(--panel);
    --radius:13px; --radius-sm:9px; --radius-lg:18px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.45);
    --shadow:0 2px 8px rgba(0,0,0,.3),0 18px 44px -22px rgba(0,0,0,.66);
    --shadow-lg:0 32px 80px -30px rgba(0,0,0,.8);
    --ring:0 0 0 3px var(--accent-soft);
    --t:.16s cubic-bezier(.4,0,.2,1);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  [data-theme="light"]{
    color-scheme:light;
    /* Soft neutral greys */
    --bg:#eaecf0; --panel:#ffffff; --panel-2:#f3f5f8; --panel-3:#e8ebf0;
    --field:#fbfcfe; --line:#dde1e8; --line-2:#c4cad4;
    --ink:#1c1f25; --muted:#5b626e; --faint:#8a909c;
    /* Yellow accent deepened to stay legible on light; fills/glows keep the bright #ffe000 tint */
    --accent:#8a6d00; --accent-2:#b8930a; --accent-ink:#1a1c20; --accent-soft:rgba(255,224,0,.22); --accent-line:rgba(138,109,0,.55);
    --info:#2f6f9e; --info-soft:rgba(47,111,158,.11);
    --ok:#4d7a3a; --ok-soft:rgba(77,122,58,.13);
    --warn:#9a6411; --warn-soft:rgba(154,100,17,.14);
    --danger:#bd4630; --danger-soft:rgba(189,70,48,.11);
    --shadow-sm:0 1px 2px rgba(20,22,28,.07);
    --shadow:0 1px 2px rgba(20,22,28,.06),0 14px 32px -16px rgba(20,22,28,.18);
    --shadow-lg:0 26px 64px -26px rgba(20,22,28,.26);
  }
  /* ============ BASE ============ */
  *{box-sizing:border-box}
  ::selection{background:var(--accent-soft)}
  *::-webkit-scrollbar{width:12px;height:12px}
  *::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
  *::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    background-image:
      radial-gradient(1100px 560px at 80% -8%,var(--accent-soft),transparent 60%),
      radial-gradient(900px 520px at -5% 0%,var(--info-soft),transparent 55%),
      radial-gradient(circle at 18% 32%,rgba(255,247,235,.018) 0,transparent .7px),
      radial-gradient(circle at 64% 71%,rgba(255,247,235,.015) 0,transparent .7px);
    background-size:auto,auto,7px 7px,11px 11px;
    background-attachment:fixed}
  /* warm laid-paper grain stays subtler in light mode so parchment reads clean */
  [data-theme="light"] body{background-image:
      radial-gradient(1100px 560px at 80% -8%,var(--accent-soft),transparent 60%),
      radial-gradient(900px 520px at -5% 0%,var(--info-soft),transparent 55%),
      radial-gradient(circle at 18% 32%,rgba(120,80,30,.03) 0,transparent .7px),
      radial-gradient(circle at 64% 71%,rgba(120,80,30,.025) 0,transparent .7px);
    background-size:auto,auto,7px 7px,11px 11px;background-attachment:fixed}
  select,button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--accent);text-decoration:none}
  :focus-visible{outline:none;box-shadow:var(--ring);border-radius:7px}
  /* ============ TOPBAR ============ */
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);
    border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brandmark{display:flex;align-items:center;gap:10px;user-select:none}
  .brandmark .logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:var(--accent-ink);
    background:linear-gradient(150deg,var(--accent-2),var(--accent));box-shadow:0 4px 14px -4px var(--accent-line),inset 0 1px 0 rgba(255,255,255,.28)}
  .brandmark .wordmark{font-weight:800;letter-spacing:-.02em;font-size:17px}
  .brandmark .wordmark small{font-weight:600;color:var(--muted);margin-left:8px;font-size:12px;letter-spacing:0}
  .switcher .chev{pointer-events:none;color:var(--faint);flex:0 0 auto}
  .iconbtn{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:var(--field);border-radius:9px;color:var(--muted);transition:all var(--t);flex:0 0 auto}
  .iconbtn:hover{color:var(--ink);border-color:var(--line-2);background:var(--panel-2)}
  .iconbtn:active{transform:translateY(1px)}
  .spacer{flex:1}
  .metastrip{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .mchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);background:var(--field);border:1px solid var(--line);padding:4px 9px;border-radius:999px;white-space:nowrap}
  @media(max-width:900px){.metastrip{display:none}}
  .savechip{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--faint);display:flex;align-items:center;gap:6px;transition:all var(--t);min-width:82px;justify-content:center}
  .savechip.saving{color:var(--info);border-color:var(--info-soft);background:var(--info-soft)}
  .savechip.saved{color:var(--ok);border-color:var(--ok-soft);background:var(--ok-soft)}
  /* live activity pill — shows what's generating right now (polls /api/status) */
  .actchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);background:var(--accent-soft);border:1px solid var(--accent-line);padding:5px 11px;border-radius:999px;white-space:nowrap;max-width:42vw;overflow:hidden;text-overflow:ellipsis}
  .actchip[hidden]{display:none}
  .actchip .spin{width:11px;height:11px;border-radius:50%;border:2px solid var(--accent);border-top-color:transparent;display:inline-block;animation:actspin .8s linear infinite;flex:none}
  @keyframes actspin{to{transform:rotate(360deg)}}
  /* ============ STEPPER ============ */
  .stepper{display:flex;align-items:center;gap:0;padding:16px 22px 6px;max-width:1240px;margin:0 auto;overflow-x:auto}
  .step{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:11px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13.5px;white-space:nowrap;transition:all var(--t);flex:0 0 auto}
  .step:hover{color:var(--ink);background:var(--panel-2)}
  .step.active{color:var(--ink);background:var(--panel);box-shadow:var(--shadow-sm)}
  .stepnode{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;font-size:12.5px;font-weight:800;position:relative;
    background:var(--field);border:1.5px solid var(--line-2);color:var(--muted);transition:all var(--t)}
  .step.active .stepnode{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .step.done .stepnode,.step.s-decided .stepnode{background:var(--ok);border-color:var(--ok);color:#fff}
  .step.s-awaiting:not(.active) .stepnode{border-color:var(--accent);color:var(--accent)}
  .step.s-locked{opacity:.55}
  .step.s-locked .stepnode{border-style:dashed}
  .stepnode .pulse{position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid var(--accent);animation:pulse 1.9s ease-out infinite;pointer-events:none}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}70%{transform:scale(1.55);opacity:0}100%{opacity:0}}
  .steprail{flex:1 1 16px;min-width:12px;height:2px;border-radius:2px;background:var(--line);margin:0 2px}
  .steprail.fill{background:linear-gradient(90deg,var(--ok),var(--accent))}
  /* ============ LAYOUT ============ */
  main{max-width:1180px;margin:0 auto;padding:20px 22px 96px}
  .panel{display:none} .panel.active{display:block;animation:fadeUp .3s cubic-bezier(.4,0,.2,1)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  h2.stage{font-size:24px;font-weight:800;letter-spacing:-.025em;margin:.1em 0 .15em}
  .sub{color:var(--muted);margin:0 0 18px;max-width:72ch;font-size:14.5px}
  .cols{display:grid;grid-template-columns:1.05fr 1fr;gap:26px}
  @media(max-width:880px){.cols{grid-template-columns:1fr}}
  .colhead{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 11px}
  /* ============ BUTTONS ============ */
  .btn{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:var(--radius-sm);padding:8px 14px;font-weight:700;font-size:13.5px;transition:all var(--t);display:inline-flex;align-items:center;gap:7px;line-height:1.1}
  .btn:hover{border-color:var(--line-2);background:var(--panel-2);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.45;cursor:default;transform:none}
  .btn.accent{background:linear-gradient(160deg,var(--accent-2),var(--accent));border-color:transparent;color:var(--accent-ink);box-shadow:0 4px 14px -5px var(--accent-line),inset 0 1px 0 rgba(255,255,255,.22)}
  .btn.accent:hover{filter:brightness(1.06);box-shadow:0 9px 22px -7px var(--accent-line),inset 0 1px 0 rgba(255,255,255,.22)}
  .btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
  .btn.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .btn.big{padding:11px 20px;font-size:15px}
  .x{color:var(--faint);border:none;background:none;font-size:15px;padding:0 3px;border-radius:6px;transition:color var(--t)}
  .x:hover{color:var(--danger)}
  /* ============ TITLE ROWS ============ */
  .titlerow{display:flex;align-items:flex-start;gap:11px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow-sm);transition:border-color var(--t)}
  .titlerow:hover{border-color:var(--line-2)}
  .titlerow.primary{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 26px -14px var(--accent-line)}
  .titlerow .pick{display:flex;flex-direction:column;gap:7px;align-items:center;padding-top:2px}
  .titlerow .body{flex:1;min-width:0}
  .titlerow .ttext{font-weight:700;font-size:15px}
  .titlerow .why{font-size:12.5px;color:var(--muted);margin-top:3px}
  .titlerow .charcount{font-size:11px;color:var(--faint);margin-top:4px;font-weight:600}
  .titlerow .charcount.bad{color:var(--warn)}
  .miniab{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;font-weight:700}
  .note{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;background:var(--field);transition:border-color var(--t)}
  .note:focus{outline:none;border-color:var(--accent-line);box-shadow:var(--ring)}
  .addrow{display:flex;gap:8px;margin-top:8px}
  .addrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--field)}
  .addrow input:focus{outline:none;border-color:var(--accent-line);box-shadow:var(--ring)}
  /* ============ QC ROWS / FINAL THUMBS / MAP CHIP ============ */
  .qcrow{display:flex;gap:10px;align-items:baseline;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin:5px 0;background:var(--panel);font-size:13.5px}
  .qcrow.fail{border-color:var(--danger-soft);background:var(--danger-soft)}
  .qcrow.warn{border-color:var(--warn-soft);background:var(--warn-soft)}
  .qcrow .qcic{flex:0 0 auto}
  .qcrow .qcid{flex:0 0 auto;font-size:11px;letter-spacing:.4px;color:var(--faint);text-transform:uppercase;font-weight:700;font-family:var(--mono)}
  .qcrow .qcdet{flex:1;min-width:0;color:var(--muted)}
  .finalthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:10px}
  .finalthumbs .ft{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow-sm)}
  .finalthumbs .ft img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
  .ovwrap{position:relative;display:block;line-height:0}
  .ovwrap .ovtext{position:absolute;inset:0;pointer-events:none}
  .ovwrap .ovtext svg{width:100%;height:100%;display:block}
  .finalthumbs .ft .cap{padding:7px 10px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .mapchip{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid var(--info-soft);background:var(--info-soft);color:var(--info);font-weight:700}
  /* ============ THUMBNAILS ============ */
  .thumbcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;margin-bottom:16px;box-shadow:var(--shadow);transition:border-color var(--t)}
  .thumbcard:hover{border-color:var(--line-2)}
  .thumbcard.chosen{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 14px 36px -18px var(--accent-line)}
  .frame169{width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#11131a}
  .frame169 svg{display:block;width:100%;height:100%}
  .thumbmeta{display:flex;align-items:center;gap:12px;margin-top:12px}
  .mobile{width:120px;height:68px;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:0 0 auto;background:#11131a}
  .mobile svg{display:block;width:100%;height:100%}
  .mobile-cap{font-size:10px;color:var(--faint);text-align:center;margin-top:4px;font-weight:600;letter-spacing:.03em}
  .thumbname{font-weight:800;font-size:15px} .thumbwhy{font-size:12.5px;color:var(--muted)}
  .forTitle{font-size:13px;font-weight:700;margin:-2px 0 12px;color:var(--accent)}
  .tempRow{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .tempbtn{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:6px 11px;font-weight:700;font-size:12px;color:var(--muted);transition:all var(--t)}
  .tempbtn:hover{border-color:var(--line-2);color:var(--ink)}
  .tempbtn.warm.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .tempbtn.cold.on{background:var(--info-soft);border-color:var(--info);color:var(--info)}
  /* ============ VOICE LAB MODAL ============ */
  .vlback{position:fixed;inset:0;z-index:80;background:rgba(6,7,10,.66);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;overflow:auto}
  .vlmodal{width:min(960px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:18px;box-shadow:0 30px 80px -28px #000;overflow:hidden}
  .vlhead{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:3}
  .vlhead h2{margin:0;font-size:17px;font-weight:800;flex:1;letter-spacing:-.01em}
  .vlbody{padding:18px 20px;display:flex;flex-direction:column;gap:15px}
  .vlsec{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .vlsec h3{margin:0 0 6px;font-size:13px;font-weight:800;letter-spacing:.02em}
  .vlsec textarea{width:100%;min-height:58px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13.5px;background:var(--field);color:var(--ink);resize:vertical}
  .vlmodal select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit}
  .vlpresets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .vlpresets button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--muted)}
  .vlpresets button:hover{color:var(--ink);border-color:var(--line-2)}
  .vlctrls{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .vlctrl{display:flex;flex-direction:column;gap:4px;min-width:168px}
  .vlctrl label{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .vlctrl .v{color:var(--accent);font-weight:700}
  .vlctrl input[type=range]{width:188px;accent-color:var(--accent)}
  .vlplayer{position:sticky;top:60px;z-index:2;display:flex;align-items:center;gap:12px;background:var(--panel-3);border:1px solid var(--line);border-radius:12px;padding:9px 13px}
  .vlplayer audio{flex:1;height:36px}
  .vlnow{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;max-width:38%;overflow:hidden;text-overflow:ellipsis}
  .vlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:10px}
  .vlcard{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--panel)}
  .vlcard.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .vlname{font-weight:800;font-size:14px}
  .vltraits{font-size:11.5px;color:var(--muted);margin:2px 0 9px;min-height:15px}
  .vlbtns{display:flex;gap:6px;flex-wrap:wrap}
  .vllib{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .vllib input[type=text]{flex:1;min-width:168px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--field);color:var(--ink)}
  .vlloading{color:var(--muted);font-size:13px;padding:8px}
  /* ============ GATE / TOGGLE / NOTES ============ */
  .gate{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow-sm)}
  .gate h3{margin:0 0 4px;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px;background:var(--field);padding:3px;gap:3px}
  .toggle button{border:none;background:none;padding:8px 22px;font-weight:800;color:var(--muted);border-radius:7px;transition:all var(--t)}
  .toggle button:hover{color:var(--ink)}
  .toggle button.yes.on{background:var(--ok);color:#fff} .toggle button.no.on{background:var(--danger);color:#fff}
  .bignote{width:100%;margin-top:14px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;min-height:66px;font:inherit;font-size:13.5px;background:var(--field);color:var(--ink);resize:vertical;transition:border-color var(--t)}
  .bignote:focus{outline:none;border-color:var(--accent-line);box-shadow:var(--ring)}
  .locked{background:var(--panel);border:1px dashed var(--line-2);border-radius:var(--radius-lg);padding:44px 40px;text-align:center;color:var(--muted)}
  .pill{display:inline-block;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;color:var(--muted)}
  ul.spine{margin:.3em 0 0;padding-left:1.1em} ul.spine li{margin:.3em 0}
  .ideabox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px}
  .ideabox .lab{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:14px}

  .kindchip:hover{border-color:var(--line-2)}
  .kindchip.illus{background:var(--field);color:var(--muted)}
  .kindchip.info{background:rgba(141,107,221,.16);color:#b69cf0;border-color:#6d4fb0}
  .kindchip.hq{background:var(--field);color:var(--muted)}
  .kindchip.hq.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
  .badge.hq{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);left:auto !important;right:9px}
  .txtrow{display:flex;gap:7px;align-items:center;margin-top:11px;flex-wrap:wrap}
  .txtrow .txtlab{font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);flex:0 0 auto}
  .txtrow .txtin{flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;background:var(--field);color:var(--ink)}
  .txtrow .txtin:focus{outline:none;border-color:var(--accent-line);box-shadow:var(--ring)}
  .txtrow .txtpos{flex:0 0 auto;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;background:var(--field);color:var(--ink)}
  /* live caption overlay drawn on the shot preview (mirrors the rendered white caption — leave white) */
  .capov{position:absolute;left:50%;transform:translateX(-50%);max-width:88%;text-align:center;font-weight:800;
    color:#fff;text-transform:uppercase;letter-spacing:.01em;line-height:1.08;font-size:clamp(12px,2.5vw,21px);
    padding:2px 8px;pointer-events:none;text-shadow:0 2px 0 #000,-2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000,0 3px 7px rgba(0,0,0,.55)}
  .cap-top-center{top:6%}
  .cap-center{top:50%;transform:translate(-50%,-50%)}
  .cap-lower-third{bottom:8%}
  .audiorow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .audiorow .player{height:34px;max-width:230px;vertical-align:middle}
  .audiorow .audsec{font-size:11.5px;color:var(--muted);font-weight:700}
  .audiorow .noaud{font-size:12px;color:var(--faint)}
  .sbgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 11px;margin-top:9px}
  .sbfield{display:flex;flex-direction:column;gap:4px}
  .sbfield label{font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
  .sbfield select,.sbfield input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:12.5px;background:var(--field);color:var(--ink)}
  .sbfield select:focus,.sbfield input:focus{outline:none;border-color:var(--accent-line);box-shadow:var(--ring)}
  .sbfield.wide{grid-column:1 / -1}
  .framenote{font-size:11.5px;color:var(--muted);margin:8px 0 2px}
  .framelist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .framerow{display:grid;grid-template-columns:128px 1fr;gap:11px;align-items:start;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:9px}
  .framerow .fthumb{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#0f1117;display:flex;align-items:center;justify-content:center}
  .framerow .fthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .framerow .fthumb .ph{font-size:10px;color:var(--faint);text-align:center;padding:4px}
  .framerow .fthumb .spin{position:absolute;inset:0;background:rgba(10,11,15,.74);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);font-size:12px}
  .fbody{min-width:0}
  .frole{font-size:10px;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:999px}
  .frole.reveal{background:var(--info-soft);color:var(--info);border:1px solid var(--info-soft)}
  .frole.reaction{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
  .fprompt{width:100%;min-height:46px;margin-top:5px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;font-size:12px;line-height:1.4;resize:vertical;background:var(--panel);color:var(--ink)}
  .fprompt:focus{outline:none;border-color:var(--accent-line);box-shadow:var(--ring)}
  .facts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center}
  .fbadge{position:absolute;top:9px;right:9px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(141,107,221,.18);color:#b69cf0;border:1px solid #6d4fb0;backdrop-filter:blur(6px)}
  .cmd{font-family:var(--mono);background:#0a0b0e;color:#e6e8ee;border:1px solid var(--line-2);padding:7px 11px;border-radius:8px;font-size:12.5px;display:inline-block}
  .roughvid{width:100%;max-width:560px;margin-top:10px;border-radius:11px;border:1px solid var(--line);background:#000;display:block;box-shadow:var(--shadow)}
  /* ============ SKELETON + MOTION ============ */
  .skeleton{position:relative;overflow:hidden;background:var(--field);border-radius:8px}
  .skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 8%,transparent),transparent);animation:shimmer 1.4s infinite}
  @keyframes shimmer{100%{transform:translateX(100%)}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

  /* ============ REVAMP: Lamplit Field Guide — Warm-Charcoal Museum Workshop ============ */
/* ===== TOPBAR — warm pressed-paper masthead ===== */
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);
    backdrop-filter:blur(16px) saturate(1.4);
    border-bottom:1px solid var(--line);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 5%,transparent);
    padding:11px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

  /* ===== BRANDMARK — stone-badge flame logo + Fraunces wordmark ===== */
  .brandmark{display:flex;align-items:center;gap:11px;user-select:none}
  .brandmark .logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--accent-ink);
    background:linear-gradient(155deg,var(--accent-2),var(--accent));
    border:1px solid color-mix(in srgb,var(--accent) 60%,#000);
    box-shadow:0 5px 16px -5px var(--accent-line),inset 0 1.5px 0 rgba(255,255,255,.36),inset 0 -2px 5px rgba(70,30,0,.26);
    transition:transform var(--t),box-shadow var(--t)}
  .brandmark:hover .logo{transform:rotate(-4deg) scale(1.04)}
  .brandmark .wordmark{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-.01em;font-size:20px}
  .brandmark .wordmark small{font-family:"Archivo",sans-serif;font-weight:600;color:var(--muted);margin-left:9px;font-size:11.5px;letter-spacing:.02em;text-transform:uppercase}

  /* ===== SWITCHER + ICON KEYS — tactile field tools ===== */
  .switcher{display:flex;align-items:center;gap:7px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:0 9px 0 11px;color:var(--muted);box-shadow:var(--shadow-sm);transition:border-color var(--t),background var(--t)}
  .switcher:hover{border-color:var(--line-2);background:var(--panel-2)}
  .switcher:focus-within{border-color:var(--accent-line);box-shadow:var(--ring)}
  /* switcher uses the custom dropdown, kept bare so the pill provides the frame; the pill glows when open */
  .switcher .ddtrigger{flex:1;min-width:0;background:none;border:none;box-shadow:none;color:var(--ink);font-weight:600;font-size:13.5px;padding:8px 2px;min-height:0;max-width:44vw;gap:6px}
  .switcher .ddtrigger:hover{background:none}
  .switcher .ddtrigger[aria-expanded="true"],.switcher .ddtrigger:focus-visible{background:none;border:none;box-shadow:none}
  .switcher:has(.ddtrigger[aria-expanded="true"]){border-color:var(--accent-line);box-shadow:var(--ring);background:var(--panel-2)}
  /* ===== SELECTS — unified, theme-aware (everything except .switcher) ===== */
  select:not(.switcher select){
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    font:inherit;font-size:13px;font-weight:600;line-height:1.2;
    color:var(--ink);background-color:var(--field);
    border:1px solid var(--line);border-radius:var(--radius-sm,8px);
    padding:8px 32px 8px 11px;min-height:36px;box-sizing:border-box;cursor:pointer;
    max-width:100%;text-overflow:ellipsis;white-space:nowrap;
    transition:border-color var(--t),box-shadow var(--t),background-color var(--t);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%23897c69' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center;background-size:13px;
  }
  select:not(.switcher select):hover{border-color:var(--line-2);background-color:var(--panel-2)}
  select:not(.switcher select):focus,
  select:not(.switcher select):focus-visible{outline:none;border-color:var(--accent-line);box-shadow:var(--ring)}
  [data-theme="light"] select:not(.switcher select){
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%23998a73' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  }
  select:not(.switcher select) option,
  select:not(.switcher select) optgroup{ background-color:var(--panel-2);color:var(--ink); }
  select:not(.switcher select) option:checked{background-color:var(--accent-soft,var(--accent-line));color:var(--ink)}
  select{color-scheme:light dark}
  [data-theme="light"] select{color-scheme:light}
  /* ===== Custom dropdown — themed OPEN list (native <select> popups can't be styled to match the cockpit) ===== */
  .ddtrigger{appearance:none;font:inherit;font-size:13px;font-weight:600;line-height:1.2;color:var(--ink);background:var(--field);
    border:1px solid var(--line);border-radius:var(--radius-sm,9px);padding:8px 11px;min-height:36px;box-sizing:border-box;cursor:pointer;
    display:inline-flex;align-items:center;gap:9px;max-width:100%;text-align:left;transition:border-color var(--t),box-shadow var(--t),background-color var(--t)}
  .ddtrigger:hover{border-color:var(--line-2);background:var(--panel-2)}
  .ddtrigger[aria-expanded="true"],.ddtrigger:focus-visible{outline:none;border-color:var(--accent-line);box-shadow:var(--ring)}
  .ddtrigger:disabled{opacity:.55;cursor:not-allowed}
  .ddtrigger .ddlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ddtrigger .ddcaret{flex:0 0 auto;width:13px;height:13px;background:no-repeat center/13px;transition:transform var(--t);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%236e7480' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>")}
  [data-theme="light"] .ddtrigger .ddcaret{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='%238a909c' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>")}
  .ddtrigger[aria-expanded="true"] .ddcaret{transform:rotate(180deg)}
  .ddmenu{position:fixed;z-index:140;background:var(--panel-2);border:1px solid var(--line-2);border-radius:11px;box-shadow:var(--shadow-lg);
    padding:5px;max-height:min(54vh,380px);overflow:auto;animation:ddpop .12s cubic-bezier(.4,0,.2,1)}
  @keyframes ddpop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
  .dditem{padding:8px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:9px}
  .dditem:hover{background:var(--field)}
  .dditem.on{background:var(--accent-soft);color:var(--ink)}
  .dditem.on::after{content:'✓';margin-left:auto;color:var(--accent);font-weight:800}
  .sbfield .ddtrigger,.txtrow .ddtrigger{font-size:12.5px;padding:7px 9px;min-height:0;gap:6px}
  .sbfield .ddtrigger{width:100%}
  .iconbtn{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:var(--field);border-radius:9px;color:var(--muted);
    box-shadow:0 2px 0 var(--line),inset 0 1px 0 color-mix(in srgb,var(--ink) 6%,transparent);
    transition:color var(--t),border-color var(--t),background var(--t),transform var(--t),box-shadow var(--t);flex:0 0 auto}
  .iconbtn:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);transform:translateY(-1px);box-shadow:0 3px 0 var(--line-2),inset 0 1px 0 color-mix(in srgb,var(--ink) 9%,transparent)}
  .iconbtn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line),inset 0 2px 4px rgba(0,0,0,.2)}

  /* ===== STEPPER — stitched field-map route + stone page-chips ===== */
  .stepper{display:flex;align-items:center;gap:2px;padding:18px 22px 8px;max-width:1240px;margin:0 auto;overflow-x:auto}
  .step{position:relative;display:flex;align-items:center;gap:9px;padding:8px 13px;border-radius:11px;cursor:pointer;color:var(--muted);
    font-family:"Archivo",sans-serif;font-weight:700;font-size:13px;letter-spacing:.005em;white-space:nowrap;
    border:1px solid transparent;transition:color var(--t),background var(--t),border-color var(--t),box-shadow var(--t);flex:0 0 auto}
  .step:hover{color:var(--ink);background:color-mix(in srgb,var(--panel-2) 72%,transparent);border-color:var(--line)}
  .step.active{color:var(--ink);background:var(--panel);border-color:var(--line-2);
    box-shadow:var(--shadow-sm),inset 0 1px 0 color-mix(in srgb,var(--ink) 5%,transparent)}
  /* stamped "you are here" underline */
  .step.active::after{content:"";position:absolute;left:13px;right:13px;bottom:-1px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  /* page-number chip: soft 7px square echoing the stone badge; digit stays in the SANS */
  .stepnode{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;
    font-family:"Archivo",sans-serif;font-size:12.5px;font-weight:800;position:relative;
    background:var(--field);border:1.5px solid var(--line-2);color:var(--muted);transition:all var(--t)}
  .step.active .stepnode{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
  .step.done .stepnode,.step.s-decided .stepnode{background:var(--ok);border-color:var(--ok);color:#fff}
  .step.s-awaiting:not(.active) .stepnode{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .step.s-locked{opacity:.55}
  .step.s-locked .stepnode{border-style:dashed}
  /* pulse child re-rounded to match the square node (CRITICAL fix) */
  .stepnode .pulse{position:absolute;inset:-1.5px;border-radius:7px;border:1.5px solid var(--accent);animation:pulse 2s ease-out infinite;pointer-events:none}
  .steplabel{letter-spacing:-.003em}
  /* rail is a quiet stitched/dashed line until progress is real, then a solid ember route */
  .steprail{flex:1 1 16px;min-width:12px;height:2px;border-radius:2px;
    background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 9px);margin:0 1px}
  .steprail.fill{background:linear-gradient(90deg,var(--ok),var(--accent))}

  /* ===== STAGE HEADINGS — Fraunces museum-placard ===== */
  h2.stage{font-family:"Fraunces",Georgia,serif;font-size:27px;font-weight:600;letter-spacing:-.012em;margin:.1em 0 .15em}

  /* ===== BUTTONS — chunky pressable workshop keys ===== */
  .btn{font-family:"Archivo",sans-serif;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:var(--radius-sm);padding:8px 14px;font-weight:700;font-size:13.5px;
    box-shadow:0 2px 0 var(--line),inset 0 1px 0 color-mix(in srgb,var(--ink) 5%,transparent);
    transition:color var(--t),border-color var(--t),background var(--t),transform var(--t),box-shadow var(--t);display:inline-flex;align-items:center;gap:7px;line-height:1.1}
  .btn:hover{border-color:var(--line-2);background:var(--panel-2);transform:translateY(-1px);box-shadow:0 3px 0 var(--line-2),inset 0 1px 0 color-mix(in srgb,var(--ink) 8%,transparent)}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line),inset 0 2px 4px rgba(0,0,0,.16)}
  .btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:var(--shadow-sm)}
  .btn.accent{background:linear-gradient(158deg,var(--accent-2),var(--accent));border-color:color-mix(in srgb,var(--accent) 55%,#000);color:var(--accent-ink);
    box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 58%,#000),0 8px 20px -8px var(--accent-line),inset 0 1px 0 rgba(255,255,255,.3)}
  .btn.accent:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 58%,#000),0 13px 26px -8px var(--accent-line),inset 0 1px 0 rgba(255,255,255,.3)}
  .btn.accent:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 58%,#000),inset 0 2px 5px rgba(80,30,0,.22)}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px;box-shadow:0 1px 0 var(--line)}
  .btn.sm:active{box-shadow:inset 0 1px 3px rgba(0,0,0,.16)}

/* Page transition — keep the existing fadeUp name, warm the easing into a gentle settle */
  .panel.active{animation:fadeUp .32s cubic-bezier(.2,.7,.2,1)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* Awaiting-human pulse — ink-stamp ring that breathes (square radius matches the node) */
  @keyframes pulse{0%{transform:scale(1);opacity:.65}70%{transform:scale(1.45);opacity:0}100%{opacity:0}}

  /* Tactile lift on hero cards (additive; existing :active resets respected) */
  .titlerow,.thumbcard,.scard,.ideacard,.musiccard{transition:border-color var(--t),box-shadow var(--t),transform var(--t)}
  .titlerow:hover,.scard:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .thumbcard:hover,.ideacard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

  /* Chip / pill / toggle press feedback */
  .mchip,.pill,.demandchip,.kindchip,.tempbtn,.pacebtn{transition:all var(--t)}
  .toggle button{transition:all var(--t),transform .1s ease}
  .toggle button:active{transform:scale(.96)}

  /* Save chip lands with a soft warm stamp */
  .savechip{transition:all var(--t)}
  .savechip.saved{animation:stampIn .3s cubic-bezier(.2,.7,.2,1)}
  @keyframes stampIn{0%{transform:scale(.92);opacity:.6}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}

  /* Chat FAB — gentle hover float, brand-consistent */
  .chatbtn{transition:transform var(--t),box-shadow var(--t),filter var(--t)}
  .chatbtn:hover{transform:translateY(-2px);filter:brightness(1.04)}

  /* Accent button sheen sweep on hover (GPU-cheap, content-free) */
  .btn.accent{position:relative;overflow:hidden}
  .btn.accent::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.16) 50%,transparent 68%);
    transform:translateX(-120%);transition:transform .6s cubic-bezier(.2,.7,.2,1);pointer-events:none}
  .btn.accent:hover::after{transform:translateX(120%)}

  @media(prefers-reduced-motion:reduce){
    .panel.active,.stepnode .pulse,.savechip.saved,.actchip .spin{animation:none}
    .titlerow:hover,.scard:hover,.thumbcard:hover,.ideacard:hover,.chatbtn:hover{transform:none}
    .btn.accent::after{display:none}
  }

/* ===== IDEA CARD — tactile field-notebook leaf with a spine that inks on hover/select ===== */
  .ideacard{position:relative;overflow:hidden}
  .ideacard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(var(--line-2),var(--line));opacity:.85;transition:background var(--t),opacity var(--t)}
  .ideacard:hover::before{opacity:1}
  .ideacard.chosen{box-shadow:0 0 0 1px var(--accent),0 16px 40px -20px var(--accent-line)}
  .ideacard.chosen::before{background:linear-gradient(var(--accent-2),var(--accent));opacity:1}
  .ideastatement{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:19px;line-height:1.3;letter-spacing:-.008em}
  .demandchip{font-family:"Archivo",sans-serif}

  /* ===== GATE — warm decision panel ===== */
  .gate h3{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-.008em}
  .toggle button.yes.on{background:var(--ok);color:#fff}
  .toggle button.no.on{background:var(--danger);color:#fff}

  /* ===== TITLE ROW — hairline framing instead of flat swap; Fraunces title text ===== */
  .titlerow .ttext{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:15.5px;letter-spacing:-.005em}
  .titlerow.primary{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 12px 28px -16px var(--accent-line)}

  /* ===== THUMB / FINAL-THUMB names in display face ===== */
  .thumbname{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:15.5px;letter-spacing:-.005em}

  /* ===== CHAT — masthead + bubbles in brand voice ===== */
  .chathead{font-family:"Archivo",sans-serif}
  .chatpanel{box-shadow:var(--shadow-lg)}
  .msg.bot{background:var(--panel-2);border:1px solid var(--line)}

  /* ===== TOAST + MODAL — warm framed cards ===== */
  .toast{font-family:"Archivo",sans-serif}
  .modalhead{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:17px;letter-spacing:-.008em}

<script>
const qs = new URLSearchParams(location.search);

let sheetInfo = null;   // {active, sheets:[{slug,title,count,hasImage,source}]} for the open video — cast at a glance
const STAGES = [['idea','① Idea'],['packaging','② Packaging'],['script','③ Script'],['scenes','④ Scenes'],['qc','⑤ QC'],['shorts','⑥ Shorts']];
async function refreshSheetInfo(){

}

const el = (t,a={},...k)=>{const e=document.createElement(t);for(const[p,v]of Object.entries(a)){
  if(p==='class')e.className=v;else if(p==='html')e.innerHTML=v;else if(p.startsWith('on'))e.addEventListener(p.slice(2),v);else e.setAttribute(p,v);}
  for(const c of k)e.append(c?.nodeType?c:document.createTextNode(c??''));return e;};

/* ---------- UI chrome: inline icons, theme toggle, header meta ---------- */
const ICONS={
  check:'<path d="M20 6 9 17l-5-5"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4 6 9M13 4l-2 5M18 4l-2 5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m21 15-5-5L5 21"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
};
function ICO(name,size){const s=size||16;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('width',s);svg.setAttribute('height',s);
  svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','2');
  svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');
  svg.innerHTML=ICONS[name]||'';return svg;}
function setupTheme(){
  const KEY='studio-theme', btn=document.getElementById('themeToggle');
  const apply=t=>{document.documentElement.setAttribute('data-theme',t);
    if(btn){btn.innerHTML='';btn.append(ICO(t==='light'?'moon':'sun',17));btn.title=t==='light'?'Switch to dark theme':'Switch to light theme';}};
  apply(document.documentElement.getAttribute('data-theme')||'dark');
  if(btn)btn.onclick=()=>{const next=(document.documentElement.getAttribute('data-theme')==='light')?'dark':'light';try{localStorage.setItem(KEY,next);}catch(_){}apply(next);};
}
function metaChip(icon,text){const c=el('span',{class:'mchip'});if(icon)c.append(icon);c.append(el('span',{},text));return c;}
function renderMeta(){
  const m=document.getElementById('meta');if(!m)return;m.innerHTML='';
  const sc=((((doc&&doc.stages&&doc.stages.scenes)||{}).candidates)||{}).scenes||[];
  if(!sc.length)return;
  const sec=sc.reduce((a,s)=>a+(+s.audioSeconds||+s.seconds||0),0);
  const imgs=sc.filter(s=>s.imagePath).length, voiced=sc.filter(s=>s.audioPath).length, narr=sc.filter(s=>(s.narration||'').trim()).length;
  m.append(metaChip(ICO('film',13),sc.length+' beats'));
  if(sec){const mm=Math.floor(sec/60)+':'+String(Math.round(sec%60)).padStart(2,'0');m.append(metaChip(ICO('clock',13),mm));}
  m.append(metaChip(ICO('image',13),imgs+'/'+sc.length));
  if(narr)m.append(metaChip(ICO('mic',13),voiced+'/'+narr));
}

/* ---------- save ---------- */
let saveTimer=null,savePending=false;   // savePending: an edit exists that the debounced save hasn't snapshotted yet
function setChip(s,txt){const c=document.getElementById('save');c.className='savechip '+s;c.textContent=txt;}

// ---- Global ACTIVITY indicator: an always-on poll of /api/status so you can SEE what's generating
// (and never have to refresh or ask). Shows a spinner + live label ("Generating images (12/40)") in the
// top bar whenever ANY job is in flight, and auto-refreshes the view the moment a job finishes. ----
let _actTimer=null,_actID=null,_actPrev=new Set();
function setActivity(label){
  const el=document.getElementById('activity'); if(!el)return;
  if(label){ el.hidden=false; el.innerHTML='<span class="spin"></span>'; el.append(document.createTextNode(label)); el.title=label; }
  else { el.hidden=true; el.textContent=''; el.removeAttribute('title'); }
}
async function pollActivity(){
  if(ID!==_actID){_actID=ID;_actPrev=new Set();}        // video switched → reset completion tracking
  if(!ID){setActivity('');return;}
  try{
    const j=await(await fetch('/api/status?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID))).json();
    setActivity(j.busy?j.label:'');
    const now=new Set((j.tasks||[]).map(t=>t.task));
    const NAMES={scenes:'Scene list',images:'Images',narration:'Narration',script:'Script',packaging:'Titles',ideas:'Ideas',research:'Research',shorts:'Shorts'};
    for(const t of _actPrev){ if(!now.has(t)){ showToast('✓ '+(NAMES[t]||t)+' ready',5500); load().then(()=>{if(!DASH)render();}).catch(()=>{}); } }
    _actPrev=now;
  }catch(_){}
}
function startActivityPoll(){ if(_actTimer)clearInterval(_actTimer); pollActivity(); _actTimer=setInterval(pollActivity,3500); }
function decisions(){const d={};for(const[k,v]of Object.entries(doc.stages||{}))if(v.decision)d[k]=v.decision;return d;}
function queueSave(){
  setChip('saving','● saving…');
  savePending=true;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flushSave,450);
}
// Fire the pending decision save NOW. Used by the debounce timer, and directly before any action
// whose server side re-reads decisions from disk (e.g. extend-and-regenerate) — a debounced save
// alone would still be pending when the server read happens.
async function flushSave(){
  clearTimeout(saveTimer);
  savePending=false;                      // decisions() snapshots the live doc at this moment
  try{
    const r=await fetch(`/api/video?channel=${encodeURIComponent(CH)}&id=${encodeURIComponent(ID)}`,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decisions:decisions()})});
    if(!r.ok)throw new Error(r.status);
    setChip('saved','✓ saved');renderTabs();
  }catch(e){setChip('','⚠ save failed');}
}
// Adopt a freshly-fetched doc WITHOUT clobbering decision edits the debounced save hasn't flushed
// yet. Background polls replace `doc` every few seconds while a generation job runs; an unmerged
// replacement between an edit and its 450ms save silently threw the edit away.
function adoptDoc(d2){
  if(savePending&&doc&&doc.stages&&d2&&d2.stages){
    for(const[k,v]of Object.entries(doc.stages)){ if(v&&v.decision){ d2.stages[k]=d2.stages[k]||{}; d2.stages[k].decision=v.decision; } }
  }
  doc=d2;
}
const dec=(stage)=>{doc.stages[stage]=doc.stages[stage]||{};return doc.stages[stage].decision=doc.stages[stage].decision||{};};

/* ---------- load ---------- */
let CHANNELS=[], DASH=false;
async function boot(){
  setupTheme();
  await loadChannels();
  const wantDash=!qs.get('id');
  await refreshVideoList(!wantDash);
  document.getElementById('refresh').onclick=()=>DASH?enterDashboard():load();
  document.getElementById('newproj').onclick=openNewProject;
  document.getElementById('castbtn').onclick=openCast;
  document.getElementById('ytbtn').onclick=openYouTube;
  document.getElementById('pulsebtn').onclick=enterPulse;
  const bm=document.querySelector('.brandmark');
  if(bm){bm.style.cursor='pointer';bm.title='Dashboard — the whole slate';bm.onclick=enterDashboard;}
  checkKey();
  checkVoice();
  checkAssemble();
  document.addEventListener('keydown',e=>{   // pipeline nav: press 1–6 to jump stages (Idea…Shorts)
    if(DASH||!doc||e.metaKey||e.ctrlKey||e.altKey)return;
    const t=e.target,tag=(t&&t.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable)||document.getElementById('castwrap')||document.getElementById('npwrap'))return;
    if(/^[1-6]$/.test(e.key)){const s=STAGES[+e.key-1];if(s){e.preventDefault();activeTab=s[0];renderTabs();render();}}
  });
  if(qs.has('pulse')) await enterPulse();
  else if(wantDash) await enterDashboard();
  startActivityPoll();   // always-on generation indicator (top bar) — survives tab/video switches
}
async function loadChannels(){
  try{ CHANNELS=await(await fetch('/api/channels')).json(); }catch(_){ CHANNELS=[]; }
  if(!CH||!CHANNELS.some(c=>c.id===CH)) CH=(CHANNELS[0]||{}).id||CH;
  const wrap=document.getElementById('channelSwitch');
  [...wrap.querySelectorAll('.ddtrigger')].forEach(e=>e.remove());
  const dd=dropdown({value:CH,cls:'switcherdd',options:CHANNELS.map(c=>({value:c.id,label:c.name})),
    onChange:async v=>{ CH=v; ID=null; await refreshVideoList(!DASH); if(DASH)enterDashboard(); }});
  dd.id='channelSel'; wrap.append(dd);
}
function channelName(){ const c=CHANNELS.find(x=>x.id===CH); return c?c.name:CH; }
async function refreshVideoList(autoOpen=true){
  let all=[]; try{ all=await(await fetch('/api/videos')).json(); }catch(_){}
  const vids=all.filter(v=>v.channel===CH);
  if(!ID||!vids.some(v=>v.id===ID)) ID=(vids[0]||{}).id||null;
  const wrap=document.getElementById('videoSwitch');
  [...wrap.querySelectorAll('.ddtrigger')].forEach(e=>e.remove());
  const dd=dropdown({value:ID||'',cls:'switcherdd',options:vids.length?vids.map(v=>({value:v.id,label:v.title})):[{value:'',label:'No videos yet'}],
    onChange:v=>{ if(!v)return; ID=v; DASH=false; history.replaceState({},'',`?channel=${CH}&id=${ID}`); load(); }});
  dd.id='videoSel'; wrap.append(dd);
  if(autoOpen){
    if(ID){ history.replaceState({},'',`?channel=${CH}&id=${ID}`); await load(); }
    else { history.replaceState({},'',`?channel=${CH}`); showEmptyChannel(); }
  }
}
/* ---------- PULSE (analytics dashboard) ---------- */
const SEV_COL={good:'#3a8d5b',bad:'#c0392b',warn:'#c9912f'};
function yppBar(label,cur,goal,mid){
  const pct=Math.min(100,Math.round((cur/goal)*100));
  const box=el('div',{style:'margin-top:8px'});
  box.append(el('div',{style:'display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px'},el('span',{},label),el('span',{},Math.round(cur).toLocaleString()+' / '+goal.toLocaleString())));
  const track=el('div',{style:'position:relative;height:11px;border-radius:6px;background:var(--line,#33373f);overflow:hidden'});
  track.append(el('div',{style:`position:absolute;left:0;top:0;bottom:0;width:${pct}%;background:var(--accent);border-radius:6px`}));
  box.append(track);
  if(mid){ const mp=Math.min(99,(mid/goal)*100); track.append(el('div',{style:`position:absolute;top:0;bottom:0;left:${mp}%;width:2px;background:var(--ink,#fff);opacity:.45`,title:mid.toLocaleString()+' gate'})); }
  return box;
}
function sparkline(arr,w,h){ w=w||150;h=h||24; if(!arr||arr.length<2)return ''; const max=Math.max(...arr,1); const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(h-(v/max)*(h-4)-2).toFixed(1)}`).join(' '); return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`; }
function pulseChannelCard(c){
  const card=el('div',{style:'border:1px solid var(--line,#3a3f48);border-radius:12px;padding:14px 16px'});
  const dot=c.connected?SEV_COL.good:SEV_COL.warn;
  card.append(el('div',{class:'row',style:'align-items:center;margin:0 0 8px'},el('span',{style:'font-weight:800;font-size:17px'},c.name),el('span',{style:`display:inline-block;width:9px;height:9px;border-radius:50%;background:${dot};margin-left:9px`,title:c.connected?'connected':'not connected'})));
  if(!c.connected){ card.append(el('div',{style:'color:var(--muted);font-size:13px'},'Not connected. Use 📺 in the top bar to connect this channel and see analytics.')); return card; }
  const v=c.vitals,d=(n)=>n>0?'▲'+n.toLocaleString():n<0?'▼'+Math.abs(n).toLocaleString():'–';
  card.append(el('div',{style:'display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px;font-size:13px'},
    el('span',{},el('b',{style:'font-size:15px'},String(v.subs)),' subs ',el('span',{style:'color:var(--muted)'},d(v.subsGained28)+'/28d')),
    el('span',{},el('b',{style:'font-size:15px'},v.views28.toLocaleString()),' views ',el('span',{style:'color:var(--muted)'},d(v.views28Delta))),
    el('span',{},el('b',{style:'font-size:15px'},v.watchHrs28),' watch-hrs/28d')));
  card.append(yppBar('Subs → 1,000',c.ypp.subs.cur,c.ypp.subs.goal,500));
  card.append(yppBar('Watch-hrs → 4,000',c.ypp.watchHours.cur,c.ypp.watchHours.goal));
  const cad=c.cadence,col=cad.daysSinceLast==null?'var(--muted)':cad.daysSinceLast>13?SEV_COL.bad:cad.daysSinceLast>7?SEV_COL.warn:SEV_COL.good;
  card.append(el('div',{style:'margin-top:9px;font-size:13px'},'Cadence ',el('b',{},cad.up28+'/28d'),el('span',{style:`color:${col};margin-left:8px`},cad.daysSinceLast==null?'no uploads yet':cad.daysSinceLast+'d since last')));
  const pl=c.pipeline,steps=[['idea','①'],['packaging','②'],['script','③'],['scenes','④'],['qc','⑤'],['shorts','⑥']];
  card.append(el('div',{style:'margin-top:8px;font-size:12px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap'},...steps.map(([k,n])=>el('span',{title:k},n+' '+(pl[k]||0)))));
  if(c.trend&&c.trend.some(v=>v>0))card.append(el('div',{style:'margin-top:8px;display:flex;align-items:center;gap:8px'},el('span',{style:'font-size:11px;color:var(--muted)'},'views 60d'),el('span',{html:sparkline(c.trend)})));
  card.append(el('div',{style:'margin-top:8px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between'},el('span',{},'Sponsors (50k) ',el('b',{},(c.sponsorPct||0)+'%')),c.statsAt?el('span',{},'synced '+c.statsAt):el('span',{})));
  return card;
}
function pulseQuadrant(channels){
  const W=600,H=340,pad=48,cols=['#e0823c','#3f6f9f','#5b8c5a'],pts=[];
  channels.forEach((c,ci)=>(c.quadrant||[]).forEach(q=>{ if(typeof q.avgPct==='number'&&typeof q.ctr==='number')pts.push({title:q.title,ctr:q.ctr,avp:q.avgPct,color:cols[ci%cols.length]}); }));
  const xMax=10,yMax=100,X=(val)=>pad+(Math.min(xMax,Math.max(0,val))/xMax)*(W-2*pad),Y=(val)=>H-pad-(Math.min(yMax,Math.max(0,val))/yMax)*(H-2*pad),ink='#8a8f99';
  let s=`<svg width="100%" viewBox="0 0 ${W} ${H}" style="max-width:600px;color:var(--ink,#e8e8e8)">`;
  s+=`<line x1="${X(4)}" y1="${pad-12}" x2="${X(4)}" y2="${H-pad}" stroke="${ink}" stroke-dasharray="3 5"/><line x1="${pad}" y1="${Y(50)}" x2="${W-pad}" y2="${Y(50)}" stroke="${ink}" stroke-dasharray="3 5"/>`;
  s+=`<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="currentColor" stroke-width="1.5"/><line x1="${pad}" y1="${pad-12}" x2="${pad}" y2="${H-pad}" stroke="currentColor" stroke-width="1.5"/>`;
  s+=`<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="${ink}">CTR % →</text><text x="13" y="${H/2}" text-anchor="middle" font-size="12" fill="${ink}" transform="rotate(-90 13 ${H/2})">Avg % viewed →</text>`;
  const ql=(x,y,t,a)=>`<text x="${x}" y="${y}" font-size="11" fill="${ink}" opacity="0.85" text-anchor="${a||'start'}">${t}</text>`;
  s+=ql(W-pad-4,Y(yMax)+8,'★ scale this','end')+ql(pad+6,Y(yMax)+8,'re-package')+ql(W-pad-4,H-pad-6,'re-hook','end')+ql(pad+6,H-pad-6,'rethink');
  s+=`<text x="${X(4)}" y="${H-pad+16}" text-anchor="middle" font-size="10" fill="${ink}">4%</text><text x="${pad-6}" y="${Y(50)+4}" text-anchor="end" font-size="10" fill="${ink}">50%</text>`;
  pts.forEach(p=>{ s+=`<circle cx="${X(p.ctr).toFixed(1)}" cy="${Y(p.avp).toFixed(1)}" r="7" fill="${p.color}" stroke="#fff" stroke-width="2"/><text x="${(X(p.ctr)+11).toFixed(1)}" y="${(Y(p.avp)+4).toFixed(1)}" font-size="11" fill="currentColor">${(p.title||'').replace(/[<&]/g,'').slice(0,22)}</text>`; });

function nextAction(v){
  const ORDER=[['idea','Idea'],['packaging','Packaging'],['script','Script'],['scenes','Scenes']];
  const st=v.stages||{};
  for(const[k,name]of ORDER)if(/await/i.test(st[k]||''))return{label:'Needs you — '+name,tab:k,hot:true};
  for(const[k,name]of ORDER)if((st[k]||'locked')==='locked')return{label:'Generate the '+name.toLowerCase(),tab:k,hot:false};
  const me=v.meta||{};
  if(me.beats&&(me.voiced<me.beats||me.imgs<me.beats))return{label:'Finish assets — '+me.imgs+'/'+me.beats+' images · '+me.voiced+'/'+me.beats+' voiced',tab:'scenes',hot:false};
  if(!me.hasCut)return{label:'Assemble the rough cut',tab:'scenes',hot:false};
  return{label:'QC · publish kit · Shorts',tab:'qc',hot:false};
}
function videoCard(v,costs){

  if(me.thumb){
    const img=el('img',{src:'/api/packaging-asset?channel='+encodeURIComponent(v.channel)+'&id='+encodeURIComponent(v.id)+'&name=final-1.png&t='+encodeURIComponent(v.updatedAt||''),alt:''});

  cover.append(el('span',{class:'vcoverfall'},(v.title||'?').slice(0,1).toUpperCase()));
  if(me.secs)cover.append(el('span',{class:'vlen'},Math.floor(me.secs/60)+':'+String(me.secs%60).padStart(2,'0')));

  const body=el('div',{class:'vbody'});

  [['idea','Idea'],['packaging','Packaging'],['script','Script'],['scenes','Scenes'],['qc','QC'],['shorts','Shorts']].forEach(([k,name])=>{
    const s=(v.stages||{})[k]||'locked';
    const cls=/decid|approv|done/i.test(s)?'done':(/await/i.test(s)?'await':'lock');
    pips.append(el('span',{class:'pip '+cls,title:name+' · '+s}));
  });
  body.append(pips);
  const bits=[];
  if(me.beats)bits.push(me.imgs+'/'+me.beats+' 🖼'+' · '+me.voiced+'/'+me.beats+' 🎙');
  if(me.shorts)bits.push('✂️ '+me.shorts);
  const cost=costs&&costs.perVideo&&costs.perVideo[v.channel+'/'+v.id];
  if(cost&&cost.imagesUsd)bits.push('$'+cost.imagesUsd.toFixed(2));
  if(v.updatedAt)bits.push(new Date(v.updatedAt).toLocaleDateString(undefined,{month:'short',day:'numeric'}));

  card.append(body);
  return card;
}

function stepState(k){

  if(/decid|approv|done|complete/i.test(raw))return 'decided';

function renderTabs(){
  const t=document.getElementById('tabs');t.innerHTML='';
  const curIdx=STAGES.findIndex(([k])=>k===activeTab);
  STAGES.forEach(([k,label],i)=>{
    const state=stepState(k), isActive=k===activeTab, name=label.replace(/^[^A-Za-z]+/,'');
    const go=()=>{activeTab=k;renderTabs();render();};
    const step=el('div',{class:'step'+(isActive?' active':'')+' s-'+state,role:'button',tabindex:'0',title:name+' · '+state,
      onclick:go,onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}}});
    const node=el('span',{class:'stepnode'});
    if(state==='decided')node.append(ICO('check',14));else node.append(document.createTextNode(String(i+1)));
    if(state==='awaiting'&&!isActive)node.append(el('span',{class:'pulse'}));
    step.append(node,el('span',{class:'steplabel'},name));
    t.append(step);
    if(i<STAGES.length-1)t.append(el('span',{class:'steprail'+((i<curIdx)?' fill':'')}));
  });
}
function render(){
  // Build the new view in a detached fragment, then swap it in with ONE replaceChildren — no empty
  // intermediate paint (the old innerHTML='' wiped to blank first → visible flash + scroll jump on every
  // poll-driven re-render). Scroll position is preserved so progress polls don't yank the page to the top.
  const m=document.getElementById('main');
  const sc=document.scrollingElement?document.scrollingElement.scrollTop:0;
  renderMeta();
  const frag=document.createDocumentFragment();
  const st=doc.stages?.[activeTab];
  if(activeTab==='qc')frag.append(qcPanel(st||{}));   // QC is deterministic — usable as soon as a storyboard exists
  else if(activeTab==='shorts')frag.append(shortsPanel(st||{}));   // Shorts Lab — usable once beats are voiced
  else if(!st||st.status==='locked')frag.append(lockedPanel());
  else if(activeTab==='idea')frag.append(ideaPanel(st));
  else if(activeTab==='packaging')frag.append(packagingPanel(st));
  else if(activeTab==='script')frag.append(scriptPanel(st));
  else if(activeTab==='scenes')frag.append(scenesPanel(st));
  else frag.append(lockedPanel());
  m.replaceChildren(frag);
  if(sc&&document.scrollingElement)document.scrollingElement.scrollTop=sc;
}
function lockedPanel(){
  const labels={script:'Scripting',scenes:'Scenes & image prompts',qc:'Pre-publish QC'};
  return el('div',{class:'panel active'},el('div',{class:'locked',html:
    `<div style="font-size:30px">🔒</div><p><b>${labels[activeTab]||'This stage'}</b> unlocks once we reach it.<br>
     Decide the earlier stages first — I'll generate the candidates for this one when it's time.</p>`}));
}

// Custom dropdown: a themed trigger + a fixed-position popup list (so the OPEN list matches the cockpit,
// which a native <select> can't). Returns the trigger element; exposes a `.value` getter/setter for compat.
function dropdown(opts){
  const items=(opts.options||[]).map(o=>typeof o==='string'?{value:o,label:o}:o);
  let val=opts.value!=null?String(opts.value):(items[0]?String(items[0].value):'');
  const trigger=el('button',{type:'button',class:'ddtrigger'+(opts.cls?' '+opts.cls:''),title:opts.title||'','aria-haspopup':'listbox','aria-expanded':'false'});
  if(opts.disabled)trigger.disabled=true;
  if(opts.minWidth)trigger.style.minWidth=opts.minWidth;
  const labelEl=el('span',{class:'ddlabel'}),caret=el('span',{class:'ddcaret'});
  trigger.append(labelEl,caret);
  const paint=()=>{const it=items.find(i=>String(i.value)===String(val));labelEl.textContent=it?it.label:'';};
  paint();
  try{Object.defineProperty(trigger,'value',{get:()=>val,set:v=>{val=String(v);paint();},configurable:true});}catch(_){}
  let menu=null,teardown=null;
  const close=()=>{if(teardown){teardown();teardown=null;}if(menu){menu.remove();menu=null;}trigger.setAttribute('aria-expanded','false');};
  const choose=it=>{val=String(it.value);paint();close();opts.onChange&&opts.onChange(it.value);};
  const open=()=>{
    if(menu){close();return;}
    menu=el('div',{class:'ddmenu',role:'listbox'});
    items.forEach(it=>menu.append(el('div',{class:'dditem'+(String(it.value)===String(val)?' on':''),role:'option',onclick:()=>choose(it)},it.label)));
    document.body.append(menu);
    const r=trigger.getBoundingClientRect();
    menu.style.minWidth=Math.max(r.width,150)+'px';
    // align the menu's item TEXT with the trigger's label: the menu has its own inner padding, so shift
    // left by that padding (item text sits at menu.left + menuPad + itemPad; trigger text at left + itemPad).
    const padL=parseFloat(getComputedStyle(menu).paddingLeft)||0;
    menu.style.left=Math.max(8,Math.min(r.left-padL,window.innerWidth-menu.offsetWidth-8))+'px';
    const mh=menu.offsetHeight,below=window.innerHeight-r.bottom;
    menu.style.top=((below<mh+12&&r.top>mh+12)?(r.top-mh-5):(r.bottom+5))+'px';
    trigger.setAttribute('aria-expanded','true');
    const onDoc=e=>{if(menu&&!menu.contains(e.target)&&!trigger.contains(e.target))close();};
    const onKey=e=>{if(e.key==='Escape')close();};
    setTimeout(()=>{document.addEventListener('mousedown',onDoc,true);document.addEventListener('keydown',onKey,true);window.addEventListener('scroll',close,true);window.addEventListener('resize',close);},0);
    teardown=()=>{document.removeEventListener('mousedown',onDoc,true);document.removeEventListener('keydown',onKey,true);window.removeEventListener('scroll',close,true);window.removeEventListener('resize',close);};
  };
  trigger.onclick=e=>{e.preventDefault();if(!trigger.disabled)open();};
  return trigger;
}

/* ---------- THUMBNAIL WIREFRAME ENGINE ----------
   A concept is a compact, structured layout spec — NOT hand-drawn SVG. The Studio renders it into a
   clean composition wireframe (real headline type + branded background + a labeled subject placeholder)
   that reads at 120×68 and feeds the Gemini final-art prompt precisely. Old hand-authored `svg` still
   renders via the fallback in thumbCard. */
// Built-in seed colors (the default cast). The SELECTED channel's cast.json colors are merged in by

  Zed:{skin:'#b9794a',hair:'#2f2a26'}, Nova:{skin:'#e0b48c',hair:'#9aa0ab'}

async function loadCastColors(){

      (j.roster||[]).forEach(c=>{ if(c&&c.color&&(c.color.skin||c.color.hair)) map[c.name]={skin:c.color.skin||'#e7d9c4',hair:c.color.hair||'#8a8f9c'}; });
    }catch(_){}

const BG_PRESETS={
  sky:['#bfe6f7','#7cc1ea'], dawn:['#ffd9a3','#ff9e7a'], sunset:['#ffb24a','#e85b8a'],
  ember:['#3a2233','#7a2e3a'], night:['#1d2740','#33486f'], ocean:['#34435f','#1f5673'],
  snow:['#cdd9e6','#eef5fb'], forest:['#5c7d4f','#27431f'], sand:['#e8d4a8','#cdb27e'],
  stone:['#6b6f78','#3a3e47'], cave:['#2a211a','#0e0b08'], blizzard:['#6e93b2','#dceaf5']
};
function xesc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function wrapText(s,per,max){const w=String(s||'').split(/\s+/).filter(Boolean);const lines=[];let cur='';
  for(const word of w){if((cur+' '+word).trim().length>per&&cur){lines.push(cur);cur=word;}else cur=(cur+' '+word).trim();}
  if(cur)lines.push(cur);return lines.slice(0,max);}
function drawWire(L){

  const cols=BG_PRESETS[L.bg]||(Array.isArray(L.bg)?L.bg:((L.bg&&L.bg.colors)||['#1b1e27','#0f1117']));
  const darkBg=/(night|ocean|ember|cave|stone)/.test(L.bg||'')||false;
  const ink=darkBg?'#0a0d12':'#11161f';                 // text outline
  const sub=L.subject||{}, who=sub.who&&CAST_COLORS[sub.who]?sub.who:'';
  const cc=who?CAST_COLORS[who]:{skin:'#e7d9c4',hair:'#8a8f9c'};
  const zone=sub.zone||'right', hero=(sub.scale||'hero')!=='medium';
  const bw=hero?540:430, bh=hero?604:452;

  const bcx=bx+bw/2;
  // ---- subject placeholder (a clean "casting block": head glyph + name + pose) ----

  if(sub.who!=='none'){
    const hr=hero?92:74, hcy=by+ (hero?150:128);
    subjSvg=`<g>
      <rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="26" fill="${acc}" fill-opacity="0.10" stroke="${acc}" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>
      <circle cx="${bcx}" cy="${hcy}" r="${hr}" fill="${cc.skin}" stroke="${ink}" stroke-width="5"/>
      <path d="M ${bcx-hr} ${hcy-6} A ${hr} ${hr} 0 0 1 ${bcx+hr} ${hcy-6} Q ${bcx} ${hcy-hr*0.5} ${bcx-hr} ${hcy-6} Z" fill="${cc.hair}" stroke="${ink}" stroke-width="4"/>
      <text x="${bcx}" y="${hcy+hr+72}" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="${hero?64:54}" fill="${darkBg?'#fff':ink}" stroke="${darkBg?ink:'#fff'}" stroke-width="6" paint-order="stroke">${xesc((who||sub.who||'CAST').toUpperCase())}</text>`;
    const pose=wrapText(sub.pose||'',26,3);
    pose.forEach((ln,i)=>{ subjSvg+=`<text x="${bcx}" y="${hcy+hr+118+i*34}" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Arial" font-weight="600" font-size="27" fill="${darkBg?'#cdd3df':'#2a2f3a'}" opacity="0.92">${xesc(ln)}</text>`; });
    subjSvg+='</g>';
  }
  // ---- prop chips along the subject block's bottom ----
  let propSvg=''; const props=(L.props||[]).slice(0,3);
  if(props.length){ const chipY=by+bh-44; let cxp=bx+26;
    props.forEach(pr=>{ const t=String(pr).toUpperCase().slice(0,16); const wch=Math.max(80,t.length*15+34);
      propSvg+=`<g><rect x="${cxp}" y="${chipY}" width="${wch}" height="40" rx="20" fill="${ink}" fill-opacity="0.55" stroke="${acc}" stroke-width="2"/><text x="${cxp+wch/2}" y="${chipY+27}" text-anchor="middle" font-family="ui-sans-serif,Arial" font-weight="800" font-size="20" fill="#fff">${xesc(t)}</text></g>`;
      cxp+=wch+12; });
  }

  const lines=(L.text||[]).map(t=>typeof t==='string'?{line:t}:t).filter(t=>t&&t.line);
  let textSvg=''; if(lines.length){
    const longest=Math.max(...lines.map(l=>l.line.length));

    const lh=fs*1.04, blockH=lh*lines.length;

    let anchor='start', tx=72, ty;
    if(tz==='right'){anchor='end';tx=W-72;} else if(tz==='center'||tz==='bottom'){anchor='middle';tx=W/2;}
    if(tz==='bottom')ty=H-58-blockH+lh*0.8; else if(tz==='top')ty=70+lh*0.8; else ty=(H-blockH)/2+lh*0.78;
    lines.forEach((l,i)=>{ const fill=l.role==='accent'?acc:(l.role==='dark'?ink:'#ffffff');
      textSvg+=`<text x="${tx}" y="${ty+i*lh}" text-anchor="${anchor}" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="${fs}" fill="${fill}" stroke="${ink}" stroke-width="${Math.round(fs*0.13)}" paint-order="stroke" stroke-linejoin="round">${xesc(l.line.toUpperCase())}</text>`; });
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${cols[0]}"/><stop offset="1" stop-color="${cols[1]||cols[0]}"/></linearGradient>
      <radialGradient id="vig" cx="50%" cy="46%" r="72%"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.28"/></radialGradient>
    </defs>
    <rect width="${W}" height="${H}" fill="url(#bgw)"/>
    <g opacity="0.06" stroke="${darkBg?'#fff':'#000'}" stroke-width="2" fill="none">${[170,260,350,440,530].map(r=>`<circle cx="120" cy="640" r="${r}"/>`).join('')}</g>
    ${subjSvg}${propSvg}
    <rect width="${W}" height="${H}" fill="url(#vig)"/>
    ${textSvg}
  </svg>`;
}
/* Just the headline text layer (transparent) — overlaid on the generated art so the title is always
   pixel-perfect, since image models garble baked-in words. Same typography/placement as drawWire. */
function drawHeadlineOverlay(L){
  L=L||{};const W=1280,H=720;const acc=L.accent||'#ec8b4e';const ink='#11161f';
  const zone=(L.subject&&L.subject.zone)||'right';
  const lines=(L.text||[]).map(t=>typeof t==='string'?{line:t}:t).filter(t=>t&&t.line);
  if(!lines.length)return '';
  const longest=Math.max(...lines.map(l=>l.line.length));
  const fs=longest<=6?156:longest<=9?128:longest<=12?104:longest<=16?84:70;
  const lh=fs*1.04, blockH=lh*lines.length;
  const tz=L.textZone||(zone==='left'?'right':zone==='center'?'bottom':'left');
  let anchor='start', tx=72, ty;
  if(tz==='right'){anchor='end';tx=W-72;} else if(tz==='center'||tz==='bottom'){anchor='middle';tx=W/2;}
  if(tz==='bottom')ty=H-58-blockH+lh*0.8; else if(tz==='top')ty=70+lh*0.8; else ty=(H-blockH)/2+lh*0.78;
  let textSvg='';
  lines.forEach((l,i)=>{ const fill=l.role==='accent'?acc:(l.role==='dark'?ink:'#ffffff');
    textSvg+=`<text x="${tx}" y="${ty+i*lh}" text-anchor="${anchor}" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="${fs}" fill="${fill}" stroke="${ink}" stroke-width="${Math.round(fs*0.13)}" paint-order="stroke" stroke-linejoin="round">${xesc(l.line.toUpperCase())}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${textSvg}</svg>`;
}

const SB_AMBIENT=['','ocean','wind','cave','forest','savanna','ice','fire','crowd'];
const SB_CUE=['','act1','rehook','act2','payoff','outro'];
function sbVals(s){
  const kind=s.kind||'illustration';
  return {
    motion:s.motion||(kind==='infographic'?'static':'push-in'),
    textAnim:s.textAnim||((s.onScreenText||'').trim()?'punch':'none'),
    sfx:Array.isArray(s.sfx)?s.sfx:[],
    ambient:s.ambient||'',
    musicCue:s.musicCue||'',
    castAction:s.castAction||'',
  };
}
function storyboardSummary(s){
  const v=sbVals(s);const bits=['🎥 '+v.motion];
  if(v.textAnim!=='none')bits.push('✨ '+v.textAnim);
  if(v.sfx.length)bits.push('🔊 '+v.sfx.join(','));
  if(v.ambient)bits.push('🌊 '+v.ambient);
  if(v.musicCue)bits.push('🎵 '+v.musicCue);
  if(v.castAction)bits.push('🎭 '+(v.castAction.length>34?v.castAction.slice(0,34)+'…':v.castAction));
  return bits.join(' · ');
}
function editSheet(scenes){
  return scenes.map((s,i)=>{
    const v=sbVals(s);const cap=(s.onScreenText||'').trim();
    const L=['#'+(s.n||i+1)+'  ['+(s.segment||'')+']  ~'+(s.audioSeconds||s.seconds||'?')+'s  ('+(s.kind||'illustration')+')'];
    if(s.narration)L.push('🎙 '+s.narration);
    if(cap)L.push('📝 TEXT "'+cap+'"  ['+(s.textPos||'top-center')+', '+v.textAnim+']');
    L.push('🎥 '+v.motion+(v.sfx.length?'   🔊 '+v.sfx.join(','):'')+(v.ambient?'   🌊 '+v.ambient:'')+(v.musicCue?'   🎵 '+v.musicCue:''));
    if(v.castAction)L.push('🎭 '+v.castAction);
    return L.join('\n');
  }).join('\n\n');
}

    if(t)cbox.append(el('div',{style:'margin-top:8px;opacity:.78'},'All videos: '+money(t.totalUsd)+' · '+imgLine(t)+' images · '+(t.ttsChars||0).toLocaleString()+' TTS chars'+(t.redoUsd>0?' · '+money(t.redoUsd)+' on re-dos':'')));
  }catch(e){cbox.textContent='⚠ '+e;}})();
  return p;
}

/* Poll-time in-place update: swap only the shot (img/badge/spinner) + audio row of cards whose asset
   state changed — no innerHTML wipe → no flash / no lost scroll / no collapsed toggles. Returns true if
   it handled the update; false (e.g. the set of shown cards changed) tells the caller to full-render once. */
function patchScenes(){
  const st=doc&&doc.stages&&doc.stages.scenes, scenes=st&&st.candidates&&st.candidates.scenes;
  if(!scenes||!scenes.length)return false;
  const grid=document.querySelector('#main .sceneGrid');
  if(!grid)return false;
  const shouldShow=s=>scenesView==='all'||s.imagePath;
  const wantN=scenes.filter(shouldShow).map(s=>String(s.n));
  const haveN=[...grid.querySelectorAll('.scard[data-scene-n]')].map(c=>c.getAttribute('data-scene-n'));
  if(wantN.length!==haveN.length||wantN.some((nn,k)=>nn!==haveN[k]))return false;
  for(const s of scenes){
    const card=grid.querySelector('.scard[data-scene-n="'+CSS.escape(String(s.n))+'"]');
    if(card){patchCardShot(card,s);patchCardAudio(card,s);}
  }
  return true;
}
function patchCardShot(card,s){
  const shot=card.querySelector('.shot'); if(!shot)return;
  if(s.imagePath){
    const src=assetSrc(s); let img=shot.querySelector('img');
    if(!img){
      const ph=shot.querySelector('.ph'); if(ph)ph.remove();
      const todo=shot.querySelector('.badge.todo'); if(todo)todo.remove();
      const a=el('a',{href:src,target:'_blank',title:'Open full size'}); a.append(el('img',{src,loading:'lazy',alt:'scene '+s.n}));
      shot.prepend(a);
      if(!shot.querySelector('.badge.done'))shot.append(el('span',{class:'badge done'},'✓ rendered'));
    }else if(img.getAttribute('src')!==src){ img.setAttribute('src',src); const link=img.closest('a'); if(link)link.setAttribute('href',src); }
  }
  const busy=regenScene.has(s.n), spin=shot.querySelector('.spin');
  if(busy&&!spin)shot.append(el('div',{class:'spin'},'🖼️ rendering…'));
  else if(!busy&&spin)spin.remove();
}
function patchCardAudio(card,s){
  const aud=card.querySelector('.audiorow'); if(!aud)return;
  if(s.audioPath&&!aud.querySelector('audio')){
    const noaud=aud.querySelector('.noaud'); if(noaud)noaud.remove();
    aud.prepend(el('span',{class:'audsec'},(s.audioSeconds?'~'+s.audioSeconds+'s':'')));
    aud.prepend(el('audio',{class:'player',controls:'controls',preload:'none',src:audioSrc(s)}));
    const vbtn=aud.querySelector('button'); if(vbtn){vbtn.classList.remove('accent');vbtn.textContent=revoiceScene.has(s.n)?'… voicing':'🔁 Re-voice';}
  }
}

    el('button',{class:'btn sm',onclick:()=>addFrame(s.n,'reveal')},'+ Reveal frame'),
    el('button',{class:'btn sm',onclick:()=>addFrame(s.n,'reaction')},'+ Reaction frame')));
  frTog.onclick=()=>{const open=frWrap.style.display==='none';frWrap.style.display=open?'block':'none';frTog.textContent=(open?'▾':'▸')+frLabel();};

  /* row actions */

  if(kind==='map'&&s.map){

    acts.append(mapBtn);

    }
  }
  if(capText)acts.append(el('button',{class:'btn sm',onclick:()=>copyText(capText,'caption')},'📋 Caption'));
  acts.append(el('button',{class:'btn sm',onclick:()=>copyText(s.narration||'','narration')},'📋 Narration'));
  meta.append(acts);
  card.append(shot,meta);
  return card;
}
// Real-artifact cutaway (Pexels): fetch / re-fetch / revert + a one-time key prompt.
async function fetchRealPhoto(n,presetQuery){
  let q=presetQuery;
  if(!q){ q=prompt('Real artifact/site to show (Pexels search) — e.g. "Otzi iceman mummy", "Lascaux cave paintings":',''); if(q===null)return; q=q.trim(); if(!q)return; }
  showToast('📷 Fetching a real photo…',2500);
  try{
    const j=await(await fetch('/api/fetch-real-photo?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({n,query:q})})).json();
    if(j.error||j.isError){ if(/No Pexels key/i.test(j.error||'')){await promptPexelsKey();} else showToast('⚠ '+(j.error||'failed'),5000); return; }
    showToast('✓ '+(j.reply||'fetched'),5000); await load();
  }catch(e){showToast('⚠ '+e,4000);}
}
