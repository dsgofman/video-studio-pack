/* ---------- in-Studio chat (Claude on the Max plan, via the server) ---------- */
const chatPanel=document.getElementById('chatpanel'),chatLog=document.getElementById('chatlog'),
  chatInput=document.getElementById('chatinput'),chatForm=document.getElementById('chatform'),
  chatSend=document.getElementById('chatsend'),chatSub=document.getElementById('chatsub'),
  chatBtn=document.getElementById('chatbtn');
chatBtn.onclick=()=>{chatPanel.classList.add('open');chatBtn.style.display='none';refreshChat();chatInput.focus();};
document.getElementById('chatclose').onclick=()=>{chatPanel.classList.remove('open');chatBtn.style.display='';};
function chatKey(){return 'chat:'+CH+'|'+ID;}
function loadChat(){try{return JSON.parse(localStorage.getItem(chatKey())||'[]');}catch(_){return[];}}
function saveChat(m){try{localStorage.setItem(chatKey(),JSON.stringify(m));}catch(_){}}
function renderChat(msgs){
  chatLog.innerHTML='';
  if(!msgs.length){chatLog.append(el('div',{class:'hint'},'Ask me to add or change a thumbnail, rework a title, brainstorm angles — I’ll edit the Studio for you. Changes appear live.'));return;}
  msgs.forEach(m=>chatLog.append(el('div',{class:'msg '+m.role+(m.err?' err':'')},m.text)));
  chatLog.scrollTop=chatLog.scrollHeight;
}
function refreshChat(){chatSub.textContent=(doc&&doc.workingTitle)||ID||'';renderChat(loadChat());}
chatForm.onsubmit=async(e)=>{
  e.preventDefault();
  const text=chatInput.value.trim();if(!text)return;
  const msgs=loadChat();msgs.push({role:'user',text});saveChat(msgs);renderChat(msgs);
  chatInput.value='';chatInput.disabled=true;chatSend.disabled=true;
  const think=el('div',{class:'msg think'},'Claude is working… (edits can take ~30–60s)');chatLog.append(think);chatLog.scrollTop=chatLog.scrollHeight;
  try{
    const r=await fetch('/api/chat?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const j=await r.json();
    const m2=loadChat();m2.push({role:'bot',text:j.reply||j.error||'(no response)',err:!!(j.isError||j.error)});saveChat(m2);
    await load();            /* refresh studio data so any edits show; also re-renders chat */
  }catch(err){
    const m3=loadChat();m3.push({role:'bot',text:'Error talking to Claude: '+err,err:true});saveChat(m3);renderChat(m3);
  }finally{chatInput.disabled=false;chatSend.disabled=false;chatInput.focus();}
};

// Big readout shown on the Script tab: target picker + how the current draft projects against it.
function scriptLengthBox(st){
  const wrap=el('div',{class:'lenbox'});
  wrap.append(el('div',{class:'lenrow'},el('span',{class:'lenlabel'},'🎯 Target length'),targetSelect(),
    el('span',{class:'est',style:'color:var(--muted)'},'sets the script word count + the 8:00 floor')));
  if(lenPlan){
    const L=lenPlan, wpmTxt=Math.round(L.wpm)+' WPM'+(L.measured?'':' · est');
    if(L.scriptWords>0){
      const ok=L.scriptMinutes>=L.targetMinutes-0.3, floorOk=L.scriptMinutes>=8.0;
      const cls=ok?'good':(floorOk?'warnx':'badx'), icon=ok?'✅':(floorOk?'⚠️':'❌');
      const gap=Math.max(0,L.targetWords-L.scriptWords);
      const msg=L.scriptWords+' words → ~'+L.scriptMinutes.toFixed(1)+' min at '+wpmTxt+'. '
        +(ok?'On target ('+L.targetMinutes+' min).'
            :'Target '+L.targetMinutes+' min ≈ '+L.targetWords+' words — about '+gap+' more'
              +(floorOk?'.':'. ⚠ Currently UNDER the 8:00 mid-roll floor.'));
      wrap.append(el('div',{class:'lenstat '+cls},icon+' '+msg));
      if(!ok)wrap.append(el('button',{class:'btn sm',style:'margin-top:9px',onclick:()=>extendScript(st)},'✨ Extend to ~'+L.targetMinutes+' min & regenerate'));
    }else{
      wrap.append(el('div',{class:'lenstat'},'Voice reads ~'+wpmTxt+'. The script will be written to ~'+L.targetWords+' words ('+L.targetMinutes+' min); hard floor '+L.floorWords+' words (8:00).'));
    }
  }
  return wrap;
}
function extendScript(st){
  const L=lenPlan||{}, dec=st.decision=st.decision||{};
  dec.notes='The current draft (~'+(L.scriptWords||'?')+' words) is TOO SHORT — it plays only ~'+(L.scriptMinutes||0).toFixed(1)
    +' min at the voice’s real pace ('+Math.round(L.wpm||165)+' WPM). Expand it to '+(L.targetWords||1500)+'+ spoken words so the finished video is at least '
    +(L.targetMinutes||8.5)+' minutes and never under 8:00. Keep the existing structure, hook and the parts that work; add real substance (more evidence, a concrete example, a deeper myth-bust, a vivid scene) — never filler or repetition.';
  showToast('Extending the script…',2000);
  // the extend note must be ON DISK before the generator (which re-reads decisions server-side)
  // starts — a debounced queueSave() would still be pending when the server read happens.
  flushSave().then(generateScript);
}
// Compact one-line banner for the Scenes tab: voiced (or estimated) runtime vs target.
function scenesLengthBanner(estMin){
  if(!lenPlan)return null;
  const L=lenPlan, mins=L.voicedMinutes>0?L.voicedMinutes:estMin;
  const ok=mins>=L.targetMinutes-0.3, floorOk=mins>=8.0;
  const cls=ok?'good':(floorOk?'warnx':'badx'), icon=ok?'✅':(floorOk?'⚠️':'❌');
  const moreWords=Math.max(0,Math.ceil((L.targetMinutes*60-mins*60)/60*L.wpm));
  const msg=(L.voicedMinutes>0?'Voiced ':'Est. ')+mins.toFixed(1)+' min vs '+L.targetMinutes+'-min target ('+Math.round(L.wpm)+' WPM'+(L.measured?'':' est')+'). '
    +(ok?'On length.':(floorOk?'':'Under the 8:00 mid-roll floor — ')+'add ~'+moreWords+' narration words.');
  return el('div',{class:'lenstat '+cls,style:'margin:0 0 12px'},icon+' '+msg);
}

function startScenesPoll(){
  stopScenesPoll(); let n=0, sawRunning=false;
  scenesPollTimer=setInterval(async()=>{
    // Hard safety: never let the loading screen hang forever (~17 min of polling — a big append
    // with several continue passes can run past 10 min server-side).
    if(++n>200){scenesGenerating=false;scenesProg=null;stopScenesPoll();if(activeTab==='scenes')render();return;}
    let running=null;
    try{ const pj=await (await fetch('/api/generate-scenes/progress?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID))).json();
      running=!!pj.running; if(running)sawRunning=true; if(pj.progress)scenesProg=pj.progress;
      if(activeTab==='scenes'&&scenesGenerating)render(); }catch(_){}
    try{const d2=await (await fetch('/api/video?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID))).json();
      const s=d2.stages&&d2.stages.scenes;
      const haveScenes=!!(s&&s.candidates&&s.candidates.scenes&&s.candidates.scenes.length);
      // Done when scenes exist AND the job is no longer running server-side. The phase==='done'
      // snapshot is just a fast-path; the running-flag is the robust signal (it survives a missed
      // progress snapshot / a late poll after a page reload, which is what left the screen stuck).
      const finished=(scenesProg&&scenesProg.phase==='done')
                   ||(sawRunning&&running===false)
                   ||(n>=3&&running===false&&haveScenes);
      if(haveScenes&&finished){adoptDoc(d2);scenesGenerating=false;scenesProg=null;stopScenesPoll();refreshLen();if(activeTab==='scenes')render();showToast('✓ Scenes ready.',6000);}
      else if(!haveScenes&&running===false&&n>=3){ // job ended without writing scenes → clear the stuck screen
        scenesGenerating=false;scenesProg=null;stopScenesPoll();if(activeTab==='scenes')render();}
    }catch(_){}
  },5000);
}
function stopScenesPoll(){if(scenesPollTimer){clearInterval(scenesPollTimer);scenesPollTimer=null;}}

/* ---------- CAST STRIP: at-a-glance "which cast is this video using", shown on Packaging + Scenes
   so the sheet decision is visible BEFORE any art (titles → thumbnails → scenes) is generated. ---------- */
function castStrip(){
  if(!sheetInfo) return el('span',{});
  const active=sheetInfo.active||'__default';
  const sheets=sheetInfo.sheets||[];
  const isDefault=(active==='__default');
  const custom=(active==='__custom');
  const cur=sheets.find(s=>s.slug===active);
  const title=custom?'This video’s custom sheet':(cur?cur.title:'Default cast');
  const count=custom?null:(cur?cur.count:null);
  const adapted=!!(doc&&doc.castAdapt&&doc.castAdapt.note);
  const t=encodeURIComponent((doc&&doc.updatedAt)||'');
  const src=custom
    ? '/api/cast/file?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID)+'&name=cast-sheet.png&t='+t
    : ((cur&&cur.hasImage)?'/api/castref?channel='+encodeURIComponent(CH)+'&slug='+encodeURIComponent(active)+'&name=cast-sheet.png&t='+t:'');
  const wrap=el('div',{class:'caststrip '+(isDefault?'warn':'ok')});
  const th=el('div',{class:'cstthumb'}); if(src)th.append(el('img',{src,alt:'cast'})); wrap.append(th);
  const mid=el('div',{style:'flex:1;min-width:0'});
  const head=el('div',{class:'row',style:'margin:0;gap:8px;align-items:baseline'});
  head.append(el('b',{},'🎭 Cast: '+xesc(title)+(count!=null?(' · '+count+' character'+(count===1?'':'s')):'')));
  if(adapted)head.append(el('span',{class:'est',style:'color:var(--accent);font-weight:700'},'· reskinned for this episode'));
  mid.append(head);
  mid.append(el('div',{class:'est'}, isDefault
    ? '⚠ Using the channel DEFAULT cast. If this video is about a different people, species, or era, pick or create the right sheet now — it flows into the thumbnail and every scene.'
    : 'Everything generated from here — thumbnail art and every scene — uses this sheet. Looks wrong? Change it before generating.'));
  wrap.append(mid);
  wrap.append(el('button',{class:'btn sm'+(isDefault?' accent':''),onclick:openCast}, isDefault?'Pick a sheet':'Change'));
  return wrap;
}
// Block silently generating art on the default cast: confirm, or bounce to the sheet picker.
function castGuard(actionLabel){
  if(sheetInfo&&(sheetInfo.active==='__default')){
    const ok=confirm('This video is set to the channel DEFAULT cast (Max / Luna / Zed / Nova).\n\n'+actionLabel+' with the default cast?\n\nOK = go ahead with the default cast.\nCancel = stop and pick a different character sheet first.');
    // A cancelled confirm used to abort SILENTLY (just opened the cast picker) — which read as "nothing
    // happened / it's broken". Make it explicit so a click never silently does nothing.
    if(!ok){ showToast('⏸ '+actionLabel+' did NOT start — you cancelled the cast prompt. Pick a sheet, or click again and choose OK to use the default cast.',6500); openCast(); return false; }
  }
  return true;
}
/* ---------- CAPTION STYLE: per-channel caption look (font/color/case/treatment). Drives the render
   AND restyles every scene-card .capov overlay live so the preview matches the output. ---------- */
let capStyle=null, capFonts=[];
const CAP_FAM={gloria:'Gloria',marker:'Marker',patrick:'Patrick',kalam:'Kalam',bangers:'Bangers',archivo:'Archivo Black'};
async function loadCapStyle(){
  try{ const j=await(await fetch('/api/caption-style?channel='+encodeURIComponent(CH))).json(); capStyle=j.style; capFonts=j.fonts||[]; applyCapStyleCss(); }catch(_){}
}
function applyCapStyleCss(){
  if(!capStyle)return; const cs=capStyle; const fam=CAP_FAM[cs.font]||'Gloria';
  const tc=cs.case==='upper'?'uppercase':(cs.case==='lower'||cs.case==='sentence')?'lowercase':'none';
  let shadow='0 0 5px rgba(10,7,4,.85),0 2px 8px rgba(0,0,0,.6)',stroke='0',bg='transparent',pad='2px 8px',radius='0';
  if(cs.treatment==='outline'){stroke='1px';shadow='0 2px 9px rgba(0,0,0,.6)';}
  else if(cs.treatment==='plate'){bg='rgba(18,14,10,.84)';pad='3px 14px 5px';radius='12px';shadow='none';}
  let css='';
  for(const k of Object.keys(CAP_FAM)) css+='@font-face{font-family:"'+CAP_FAM[k]+'";src:url(/api/font?name='+k+')}';
  css+='.capov{font-family:"'+fam+'",cursive!important;font-weight:400!important;color:'+cs.color+'!important;'
    +'text-transform:'+tc+'!important;-webkit-text-stroke:'+stroke+' rgba(10,7,4,.6);text-shadow:'+shadow+'!important;'
    +'background:'+bg+'!important;padding:'+pad+'!important;border-radius:'+radius+'!important}';
  if(cs.case==='sentence')css+='.capov::first-letter{text-transform:uppercase}';
  let st=document.getElementById('capdyn'); if(!st){st=document.createElement('style');st.id='capdyn';document.head.append(st);} st.textContent=css;
}

async function uploadCastRef(e,statusEl){
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=async()=>{ try{
    const j=await (await fetch('/api/cast/upload-ref?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataUrl:reader.result})})).json();
    if(j.ok){if(statusEl)statusEl.textContent='look reference uploaded ✓'; showToast('✓ Look reference saved — it anchors the next Adapt.',4000);}
    else showToast('⚠ '+(j.error||'upload failed'),4000);
  }catch(err){showToast('⚠ '+err,4000);} };
  reader.readAsDataURL(f);
}
async function adaptCast(note){
  note=(note||'').trim();
  if(!note){showToast('Describe the look in the text box first.',3500);return;}
  if(castAdapting)return;
  castAdapting=true; if(activeTab==='scenes')render();
  showToast('🎭 Adapting the cast to this video… (~1–2 min)');
  try{
    const body={note}; body.refImage=(doc.castAdapt&&doc.castAdapt.refImage)||'_reference.png';
    const j=await (await fetch('/api/cast/adapt?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
    await load();
    showToast(j.ok?('✓ Cast adapted: '+(j.made||[]).join(', ')+(j.usedRef?' (matched your reference)':'')):('⚠ '+(j.error||j.reply||'failed')),7000);
  }catch(e){showToast('⚠ '+e,5000);}
  finally{castAdapting=false; if(activeTab==='scenes')render();}
}
async function revertCast(){
  if(!confirm('Remove this video’s adapted cast and revert to the channel default? Re-generate the images afterwards.'))return;
  try{ await fetch('/api/cast/clear?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID),{method:'POST'}); await load(); showToast('Reverted to the channel cast.',4000);}catch(e){showToast('⚠ '+e,4000);}
}
/* ---------- per-scene edits (write straight into the scene candidate) ---------- */
const sceneSaveTimers={};
function saveScene(n,patch,immediate){
  const sc=((doc.stages.scenes||{}).candidates||{}).scenes||[];
  const s=sc.find(x=>String(x.n)===String(n)); if(s)Object.assign(s,patch);   // optimistic local update
  setChip('saving','● saving…');
  const go=async()=>{
    try{
      const r=await fetch('/api/update-scene?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID),
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({n,patch})});
      if(!r.ok)throw new Error(r.status); setChip('saved','✓ saved');
    }catch(e){setChip('','⚠ save failed');}
  };
  clearTimeout(sceneSaveTimers[n]);
  if(immediate)return go();
  sceneSaveTimers[n]=setTimeout(go,500);
}
async function saveAndRender(n,prompt){

  async function useVoice(vId,name){ try{
      const j=await(await fetch('/api/set-voice?channel='+encodeURIComponent(CH||''),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voiceId:vId,model:model.value,stability:+stab.value,style:+style.value})})).json();
      if(j.ok){vlCur=vId;voiceId=vId;voiceModel=model.value;showToast('✓ "'+name+'" set as the channel voice — now Re-voice ALL to apply it',3400);markCur();if(activeTab==='scenes')render();}
      else showToast('⚠ '+(j.error||'could not set'),3000);
    }catch(e){showToast('⚠ '+e,3000);} }
  function markCur(){ if(!modal)return; modal.querySelectorAll('.vlcard').forEach(c=>{const cur=c.dataset.vid===vlCur;c.classList.toggle('cur',cur);const u=c.querySelector('.useb');if(u){u.classList.toggle('accent',cur);u.textContent=cur?'✓ Channel voice':'Use this voice';}}); }
  function vcard(v){
    const traits=[v.descriptive,v.gender,v.age&&String(v.age).replace('_',' '),v.accent,(v.use_case||'').replace(/_/g,' ')].filter(Boolean).join(' · ')+(v.clones?(' · '+(v.clones).toLocaleString()+' uses'):'');
    const labelTraits=v.labels?[v.labels.descriptive,v.labels.gender,(v.labels.use_case||'').replace(/_/g,' ')].filter(Boolean).join(' · '):'';
    const c=el('div',{class:'vlcard'}); c.dataset.vid=v.voice_id;
    c.append(el('div',{class:'vlname'},v.name||'(unnamed)'));
    c.append(el('div',{class:'vltraits'},(traits.trim()||labelTraits||'')));
    const b=el('div',{class:'vlbtns'});
    b.append(el('button',{class:'btn sm',onclick:()=>playSample(v.preview_url,v.name)},'▶ Sample'));
    b.append(el('button',{class:'btn sm accent',onclick:()=>playMine(v.voice_id,v.name)},'🎙 My line'));
    b.append(el('button',{class:'btn sm useb',onclick:()=>useVoice(v.voice_id,v.name)},'Use this voice'));
    c.append(b); return c;
  }
  const account=el('div',{class:'vlgrid'},el('div',{class:'vlloading'},'loading…'));
  fetch('/api/voice-list?channel='+encodeURIComponent(CH||'')).then(r=>r.json()).then(j=>{ account.innerHTML=''; vlCur=j.current||vlCur;
    if(j.error){account.append(el('div',{class:'vlloading'},j.error));return;}
    if(!(j.voices||[]).length){account.append(el('div',{class:'vlloading'},'no voices on the account'));return;}
    j.voices.forEach(v=>account.append(vcard(v))); markCur();
  }).catch(e=>{account.innerHTML='';account.append(el('div',{class:'vlloading'},'error: '+e));});
  const q=el('input',{type:'text',placeholder:'search a name or trait (e.g. James, calm, documentary)…'});
  const gender=dropdown({value:'male',options:[{value:'',label:'any gender'},{value:'male',label:'male'},{value:'female',label:'female'}]});
  const use=dropdown({value:'narrative_story',options:[{value:'narrative_story',label:'narration'},{value:'informative_educational',label:'educational'},{value:'conversational',label:'conversational'},{value:'',label:'any use'}]});
  const lib=el('div',{class:'vlgrid'},el('div',{class:'vlloading'},'searching…'));
  function searchLib(){ lib.innerHTML='<div class="vlloading">searching…</div>'; const p=new URLSearchParams();
    if(q.value.trim())p.set('search',q.value.trim()); if(gender.value)p.set('gender',gender.value); if(use.value)p.set('use_case',use.value);
    fetch('/api/shared-voices?'+p.toString()).then(r=>r.json()).then(j=>{ lib.innerHTML=''; const vs=(j.voices||[]).sort((a,b)=>(b.clones||0)-(a.clones||0));
      if(!vs.length){lib.append(el('div',{class:'vlloading'},'no matches — try a different search'));return;}
      vs.forEach(v=>lib.append(vcard(v))); markCur();
    }).catch(e=>{lib.innerHTML='';lib.append(el('div',{class:'vlloading'},'error: '+e));}); }
  q.addEventListener('keydown',e=>{if(e.key==='Enter')searchLib();}); searchLib();
  const presets=el('div',{class:'vlpresets'});
  [['Hook (open ocean)','Sixty-five thousand years ago, someone pushed off from a beach, paddled past the last island they could see, and kept going — straight out into open ocean.'],
   ['Debunk (Zed)','And the skeptics pounced — for good reason. So a separate team went back and tested it a completely different way. Same answer.'],
   ['Payoff','We didn’t adapt to the world. We carried our world with us. That’s the whole trick.']].forEach(([lbl,txt])=>presets.append(el('button',{onclick:()=>{line.value=txt;}},lbl)));
  const close=()=>{const b=document.querySelector('.vlback');if(b)b.remove();};
  const modal=el('div',{class:'vlmodal'});
  modal.append(
    el('div',{class:'vlhead'}, el('h2',{},'🎙 Voice Lab'), el('button',{class:'iconbtn',title:'Close',onclick:close},'✕')),
    el('div',{class:'vlbody'},
      el('div',{class:'vlsec'}, el('h3',{},'Test line'),
        el('p',{class:'thumbwhy',style:'margin:.1em 0 .5em'},'Type a line, set expressiveness, then ▶ Sample (the voice’s official demo) or 🎙 My line (reads your text). A little style (~0.3–0.4) adds natural inflection without going theatrical.'),
        line, presets,
        el('div',{class:'vlctrls'},
          el('div',{class:'vlctrl'}, el('label',{},'Model'), model),
          el('div',{class:'vlctrl'}, el('label',{},'Stability ',stabV), stab),
          el('div',{class:'vlctrl'}, el('label',{},'Expressiveness ',styleV), style))),
      el('div',{class:'vlplayer'}, now, audio),
      el('div',{class:'vlsec'}, el('h3',{},'Your account voices'), account),
      el('div',{class:'vlsec'}, el('h3',{},'Browse the ElevenLabs library'),
        el('div',{class:'vllib'}, q, gender, use, el('button',{class:'btn sm accent',onclick:searchLib},'Search')),
        lib))
  );
  const back=el('div',{class:'vlback',onclick:e=>{if(e.target===back)close();}}, modal);
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}});
  document.body.append(back);
}
/* ---------- auto-assembler (Remotion rough cut) ---------- */
let asm={installed:false,running:false,status:{},hasOutput:false}, asmPollTimer=null;
async function checkAssemble(){
  try{ asm=await (await fetch('/api/assemble-status?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID))).json();
    if(activeTab==='scenes')render(); if(asm.running)startAsmPoll();
  }catch(_){}
}
function videoFileUrl(which,t){return '/api/video-file?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID)+'&which='+which+(t?'&t='+encodeURIComponent(t):'');}
async function startAssemble(opts){
  opts=opts||{}; const isSample=!!(opts.from||opts.to);
  showToast('🎬 Starting '+(isSample?'sample':'full')+' render…');
  try{ const j=await (await fetch('/api/assemble?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(opts)})).json();
    if(j.needsSetup||j.isError){showToast('⚠ '+(j.error||'could not start'),6000);return;}
    asm.running=true; if(activeTab==='scenes')render(); startAsmPoll();
  }catch(e){showToast('⚠ '+e,4000);}
}
function startAsmPoll(){ stopAsmPoll(); asmPollTimer=setInterval(async()=>{
  try{ const j=await (await fetch('/api/assemble-status?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID))).json();
    const was=asm.running; asm=j; if(activeTab==='scenes')render();
    if(was&&!asm.running){ stopAsmPoll(); const st=asm.status||{};
      showToast(st.state==='error'?('⚠ Render failed: '+(st.message||'see 05-edit/render.log')):'✓ Rough cut ready → 05-edit/rough-cut.mp4',8000); }
  }catch(_){}
},3000); }
function stopAsmPoll(){ if(asmPollTimer){clearInterval(asmPollTimer);asmPollTimer=null;} }
function assembleToolbar(scenes){
  const bar=el('div',{class:'imgbar'});
  bar.append(el('b',{},'🎬 Assemble rough cut'));
  const imgs=scenes.filter(s=>s.imagePath).length;
  const voiced=scenes.filter(s=>s.audioPath).length;
  const withNarr=scenes.filter(s=>(s.narration||'').trim()).length;
  if(!asm.installed){
    bar.append(el('div',{class:'est'},'One-time setup: install the renderer, then re-check.'));
    bar.append(el('div',{style:'margin-top:6px'},el('span',{class:'cmd'},'cd _studio/render && npm install')));
    bar.append(el('div',{style:'margin-top:8px'},el('button',{class:'btn sm',onclick:checkAssemble},'↻ Re-check')));
    return bar;
  }
  bar.append(el('div',{class:'est'},imgs+'/'+scenes.length+' images · '+voiced+'/'+withNarr+' beats voiced. Builds a rough cut from whatever is rendered — Ken Burns + reveal frames + captions'+(voiced?' + narration (auto-timed)':' (silent until you generate narration)')+'.'));
  if(asm.running){
    const st=asm.status||{}, p=st.progress||0;
    bar.append(el('div',{class:'est'},'⏳ '+(st.mode?st.mode+' · ':'')+(st.state||'working')+(st.state==='rendering'?' — '+p+'%':'…')));
    const b=el('div',{class:'progbar'});b.append(el('i',{style:'width:'+p+'%'}));bar.append(b);
    return bar;
  }
  const row=el('div',{class:'row'});
  row.append(el('button',{class:'btn',onclick:()=>startAssemble({from:1,to:6}),title:'Render just the first ~6 beats to audit motion/captions/timing fast'},'🎬 Sample (hook, ~6 beats)'));
  row.append(el('button',{class:'btn accent',onclick:()=>startAssemble()},asm.hasFull?'🔄 Re-assemble full':'🎬 Assemble full'));
  bar.append(row);
  if(asm.hasFull||asm.hasSample){
    const dl=el('div',{class:'row',style:'margin-top:6px'});
    if(asm.hasFull)dl.append(el('a',{class:'btn sm',href:videoFileUrl('full'),target:'_blank',download:'rough-cut.mp4'},'⬇ Full MP4'));
    if(asm.hasSample)dl.append(el('a',{class:'btn sm',href:videoFileUrl('sample'),target:'_blank',download:'rough-cut-sample.mp4'},'⬇ Sample MP4'));
    bar.append(dl);
    const st=asm.status||{};
    const which=(st.mode==='sample'&&asm.hasSample)?'sample':(asm.hasFull?'full':'sample');
    bar.append(el('div',{class:'est',style:'margin-top:6px'},'Showing the '+which+' cut'+(st.beats?' · '+st.beats+' beats':'')+(st.durationSec?' · ~'+fmtSec(st.durationSec):'')+(st.skipped?' · '+st.skipped+' skipped (no image/audio yet)':'')));
    bar.append(el('video',{class:'roughvid',controls:'controls',preload:'metadata',src:videoFileUrl(which,st.updatedAt)}));
  }
  return bar;
}
function imageToolbar(scenes){
  const bar=el('div',{class:'imgbar'});
  const made=scenes.filter(s=>s.imagePath).length;
  if(!hasGeminiKey){
    bar.append(el('b',{},'Auto-generate the images with Gemini'));
    bar.append(el('div',{class:'est'},'Paste your Google AI Studio key (aistudio.google.com/apikey) to generate every image in one click. Stored locally only.'));
    const inp=el('input',{type:'password',placeholder:'Gemini API key…'});
    bar.append(el('div',{class:'keyrow'},inp,el('button',{class:'btn',onclick:()=>saveKey(inp.value)},'Save key')));
    return bar;
  }
  const progBar=()=>{const b=el('div',{class:'progbar'});b.append(el('i',{style:'width:'+Math.round((made/Math.max(1,scenes.length))*100)+'%'}));return b;};
  if(imagesGenerating){
    bar.append(el('b',{},'🖼️ Generating with Gemini…'));
    bar.append(el('div',{class:'est'},made+' / '+scenes.length+' images done — leave this open; shots fill in below as they finish.'));
    bar.append(progBar());
    return bar;
  }
  bar.append(el('div',{class:'est'},'Gemini images: '+made+' / '+scenes.length+' rendered'+(made<scenes.length?(' · remaining run ≈ $'+((scenes.length-made)*0.039).toFixed(2)+' (~$0.039/image)'):' · complete ✓')+'.'));
  if(made)bar.append(progBar());
  const row=el('div',{class:'row'});
  row.append(el('button',{class:'btn',onclick:lockCast},'🎭 Lock the cast'));
  const complete=made>=scenes.length;
  const genAll=el('button',{class:'btn accent',onclick:()=>genImages(false)},complete?'✓ All rendered':(made?'🖼️ Generate '+(scenes.length-made)+' missing':'🖼️ Generate all images'));
  if(complete)genAll.disabled=true;
  row.append(genAll);
  row.append(el('button',{class:'btn',onclick:()=>genImages(true)},made?'Re-render scene 1':'Test scene 1'));
  bar.append(row);
  bar.append(el('div',{class:'est',style:'margin-top:6px'},'Lock the cast once (per-character refs), then Generate. The full run skips images you already have — to redo one shot, use its 🔄 button below.'));
  /* Veo motion clips — OFF by default (slow, pricey, needs Veo access + an identity call). Toggle reveals 🎬 Animate per beat. */
  const veoRow=el('div',{class:'est',style:'margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap'});
  veoRow.append(el('span',{},'🎬 Veo motion clips (animate a still into video on hero beats):'));
  veoRow.append(el('button',{class:'btn sm'+(veoEnabled?' accent':''),title:'OFF by default — Veo is slow + pricey and needs Veo access on your Gemini key. Turning it on reveals a 🎬 Animate button on each beat.',onclick:async function(){
    try{ const j=await(await fetch('/api/veo-enable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:!veoEnabled})})).json();
      if(j.ok){veoEnabled=!!j.veoEnabled;showToast('Veo animation '+(veoEnabled?'ON — a 🎬 Animate button now shows on each beat.':'off.'),3500);render();}
    }catch(e){showToast('⚠ '+e,3000);} }}, veoEnabled?'On':'Off'));
  bar.append(castAdaptBlock());
  return bar;
}
/* ---------- MUSIC BED BROWSER (audition only — nothing is rendered) ---------- */
let musicLib=null, musicOpen=false, musicLoading=false;
function musicToolbar(){
  const bar=el('div',{class:'imgbar'});
  const head=el('div',{class:'row',style:'margin-top:0'});
  head.append(el('b',{style:'flex:1'},'🎵 Music bed — browse & audition'));
  head.append(el('button',{class:'btn sm',onclick:()=>{musicOpen=!musicOpen;if(musicOpen&&!musicLib)loadMusicLib();else render();}},musicOpen?'Hide':'Browse beds'));
  bar.append(head);
  bar.append(el('div',{class:'est'},'Listen to candidate tracks — just the audio, nothing renders. “Use as channel bed” swaps the track the assembler ducks under the narration; re-assemble afterward to hear it in the cut. All tracks are CC-BY (the credit line travels into the description automatically).'));
  if(!musicOpen)return bar;
  if(musicLoading||!musicLib){bar.append(el('div',{class:'est',style:'margin-top:8px'},'Loading tracks…'));return bar;}
  const tracks=musicLib.tracks||[];
  if(!tracks.length){bar.append(el('div',{class:'est',style:'margin-top:8px'},'No tracks in this channel’s _assets/music/_auditions/. Drop .mp3 files there (and optionally add them to library.json) to audition them.'));return bar;}
  const wrap=el('div',{class:'musicgrid'});
  wrap.addEventListener('play',(e)=>{wrap.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause();});},true); // one-at-a-time
  tracks.forEach(t=>{
    const card=el('div',{class:'musiccard'+(t.isBed?' isbed':'')});
    const top=el('div',{class:'row',style:'margin-top:0;justify-content:space-between'});
    top.append(el('div',{class:'mtitle'},t.title));
    top.append(el('span',{class:'mbadge'+(t.isBed?' cur':'')},t.isBed?'● current bed':(t.license||'CC-BY')));
    card.append(top);
    const sub=[t.composer,...(t.mood||[])].filter(Boolean).join(' · ');
    if(sub)card.append(el('div',{class:'mmood'},sub));
    if(t.note)card.append(el('div',{class:'mnote'},t.note));
    const au=el('audio',{controls:'controls',preload:'none'});
    au.src='/api/music-file?channel='+encodeURIComponent(CH)+'&name='+encodeURIComponent(t.file);
    card.append(au);
    const actions=el('div',{class:'row'});
    if(!t.isBed)actions.append(el('button',{class:'btn sm',onclick:()=>setBed(t)},'✓ Use as channel bed'));
    card.append(actions);
    if(t.attribution)card.append(el('div',{class:'mcredit'},'Credit: '+t.attribution));
    wrap.append(card);
  });
  bar.append(wrap);
  return bar;
}
async function loadMusicLib(){
  musicLoading=true;render();
  try{musicLib=await(await fetch('/api/music-library?channel='+encodeURIComponent(CH))).json();}
  catch(_){musicLib={tracks:[]};}
  musicLoading=false;render();
}
async function setBed(t){
  if(!confirm('Set “'+t.title+'” as the channel music bed?\n\nThis only swaps the bed file — nothing renders now. Re-assemble the video to hear it.'))return;
  try{
    const j=await(await fetch('/api/set-bed?channel='+encodeURIComponent(CH)+'&id='+encodeURIComponent(ID)+'&name='+encodeURIComponent(t.file),{method:'POST'})).json();
    if(j&&j.ok){showToast('✓ “'+t.title+'” is now the channel bed — re-assemble to hear it',3400);musicLib=null;loadMusicLib();}
    else showToast('Couldn’t set bed: '+((j&&j.error)||'unknown error'),3200);
  }catch(e){showToast('Set-bed failed: '+e.message,3200);}
}
function copyText(t,label){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>showToast('Copied '+(label||'')+' ✓',1600),()=>fallbackCopy(t,label));
  }else fallbackCopy(t,label);
}
function fallbackCopy(t,label){
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();
  try{document.execCommand('copy');showToast('Copied '+(label||'')+' ✓',1600);}catch(_){showToast('Copy failed — select it manually',2600);}
  ta.remove();
}

boot();
</script>
